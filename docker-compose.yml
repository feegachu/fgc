# 팀원 전원이 똑같은 PostgreSQL 17을 씁니다.
# "제 컴퓨터에선 되는데요"를 없애는 것이 목적입니다.
services:
  db:
    image: postgres:17
    container_name: fgc-db
    environment:
      POSTGRES_DB: fgc
      POSTGRES_USER: fgc
      POSTGRES_PASSWORD: fgc_local_only   # 로컬 전용. 실제 비밀번호가 아님
      TZ: Asia/Seoul
    ports:
      - "5433:5432"
    volumes:
      - fgc-pgdata:/var/lib/postgresql/data
volumes:
  fgc-pgdata: