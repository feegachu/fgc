# 보안 응답 헤더 (TER-009·SER-007, #677). default.conf.template 이 include 한다.
# nginx 는 location 안에 add_header 가 하나라도 있으면 server 의 add_header 를 물려받지 않는다.
# 그래서 server 문맥과, add_header 를 쓰는 location 마다 이 파일을 include 한다.
# 값은 server 문맥의 set 으로 정하고 location 이 바꿀 수 있다($fgc_csp). 값이 빈 헤더는 보내지 않는다($fgc_hsts).
add_header Content-Security-Policy $fgc_csp always;
add_header X-Content-Type-Options nosniff always;
# 같은 출처 iframe(상품 추천 AI 모달)을 허용한다. 실제 판단은 CSP frame-ancestors 'self' 가 하고, 이 줄은 구형 브라우저용이다.
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# HTTPS 에서만 보낸다. 운영 TLS 설정(deploy-host.sh 00-tls.conf)이 값을 채운다.
add_header Strict-Transport-Security $fgc_hsts always;
