# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# ---------------------------------------------------------------- #
# AI 기본 설정 (언어 및 페르소나)
# ---------------------------------------------------------------- #

# AI가 응답할 때 사용할 기본 언어를 설정합니다.
language: ko-KR
# AI의 페르소나와 응답 톤앤매너를 상세하게 지시합니다. 최대 200자까지 작성할 수 있습니다.
tone_instructions: >
  당신은 '신한DS금융소프트웨어아카데미'의 코치입니다. 목표는 팀원들이 코드 품질을 개선하며 성장하도록 돕는 것입니다.
  1. 피드백은 명확하고 구체적이어야 하며, 문제의 원인과 개선 방법을 반드시 제시하세요.
  2. 리뷰는 교육적이어야 하며, 관련 개념이나 공식 문서를 함께 추천하세요.
  3. 비판보다는 개선 중심의 제안을 우선하세요.
  4. 칭찬은 짧고 위트 있게 작성하세요.

# ---------------------------------------------------------------- #
# 코드 리뷰 기능 세부 설정
# ---------------------------------------------------------------- #
reviews:
  # 리뷰의 전반적인 스타일을 설정합니다. 'chill'은 비교적 덜 엄격하고 부드러운 톤을 의미합니다.
  profile: chill
  # CodeRabbit의 코멘트를 모두 `resolve`하면, 자동으로 Approve를 하는 기능입니다.
  # 머지 조건은 develop 브랜치 보호 규칙(승인 1인 + CI `build` 통과)으로 강제하므로
  # CodeRabbit이 자동 Approve에 관여하지 않도록 false로 둡니다. (FGC-QUR-004 "최소 1인")
  request_changes_workflow: false
  # PR의 전체적인 변경 사항에 대한 고수준의 요약(summary)을 생성할지 여부입니다.
  high_level_summary: true
  # 변경된 각 파일에 대한 요약을 생성할지 여부입니다.
  # PR이 너무 길어지는 것을 방지하기 위해 비활성화했습니다.
  changed_files_summary: false
  # 코드의 실행 흐름을 보여주는 시퀀스 다이어그램을 생성할지 여부입니다.
  # PR이 너무 길어지는 것을 방지하기 위해 비활성화했습니다.
  sequence_diagrams: false
  # PR에 연결된 이슈(Issue)를 분석하여 리뷰 컨텍스트에 활용할지 여부입니다.
  assess_linked_issues: true
  # 연관된 다른 이슈를 찾아서 링크할지 여부입니다.
  related_issues: false
  # 연관된 다른 PR을 찾아서 링크할지 여부입니다.
  related_prs: false
  # PR에 적절한 레이블(e.g., 'bug', 'enhancement')을 제안할지 여부입니다.
  suggested_labels: false
  # 제안된 레이블을 자동으로 PR에 적용할지 여부입니다.
  auto_apply_labels: false
  # 이 PR을 리뷰할 만한 적절한 동료 리뷰어를 추천할지 여부입니다.
  suggested_reviewers: false
  # 추천된 리뷰어를 자동으로 할당할지 여부입니다.
  auto_assign_reviewers: false
  # 리뷰 요약에 위트 있는 시(poem)를 포함할지 여부입니다.
  # 몇몇 팀원들의 반대가 있었지만, CodeRabbit이 써주는 시가 귀여워서 개인 취향으로 강력 주장해서 활성화시켰습니다.
  poem: true
  # 특정 파일 경로에 따라 다른 리뷰 지침을 적용합니다.
  #
  # ⚠️ 경로는 반드시 이 저장소에 실제로 존재하는 경로여야 합니다.
  #    이전에는 `backend/**`로 적혀 있었는데 FGC는 모노레포가 아니라 루트가 `src/`인
  #    단일 Gradle 모듈이라 매칭되는 파일이 0개였고, 아래 지침이 한 번도 적용되지
  #    않았습니다. 경로를 바꿀 때는 `git ls-files '<패턴>' | wc -l`로 먼저 확인하세요.
  path_instructions:
    - path: "src/main/java/**"
      instructions: |
        FGC는 보험 판매수수료 정산·규제 검증 시스템입니다. 금액 계산이 틀리면 규제 위반이 됩니다.
        1. 금액 반올림은 상세행 단위(수수료 규칙 1행·계약 1건·수취인 1명·회차 1개)로 먼저
           원 단위 HALF_UP 한 뒤 합산해야 합니다. 합계를 먼저 내고 반올림하면 위반입니다.
           (근거: docs/FGC_가상_GA_운영정책서_v1_0.md 제17조의2)
        2. 금액은 BigDecimal만 씁니다. double/float 사용은 지적해주세요.
        3. 한도·분급·환수 계산은 docs/07_규제조문표_v0.2.1.md의 REG-01~24와 대조해주세요.
        4. 요구사항 ID는 FGC-FUN-xxx 형식입니다. 구현이
           docs/FGC_요구사항명세서_v2_2_2_정합성교정_FUN_기능_요구사항.CSV의
           `검증기준(인수조건)` 열을 만족하는지 확인해주세요.
        5. 지적할 때는 근거 문서 경로와 줄 번호를 함께 밝혀주세요.
           근거를 못 찾으면 추측하지 말고 "근거 없음 — 확인 필요"라고 써주세요.
        6. 가독성, 예외처리, 모듈화, 공통 예외 처리, 확장성도 함께 봐주세요.
        7. 미작성한 테스트가 있다면 어떤 테스트가 필요한지 제안해주세요.
           (예: 계산 경계값 단위 테스트, API 테스트, Mapper 통합 테스트)
        8. 리뷰가 너무 많으면 피로감을 줍니다. 꼭 필요한 부분에 집중해주세요.
        9. 리뷰는 해당 라인 범위의 코멘트로 남겨주세요.

    - path: "src/main/resources/db/migration/**"
      instructions: |
        1. 이미 적용된 Flyway 마이그레이션 파일 수정은 금지입니다. 새 V 파일로만 변경합니다.
        2. db/migration 과 db/demo 사이에 버전 번호가 겹치면 안 됩니다.
           PR #30에서 병합 후 V6·V7이 양쪽에 되살아난 사고가 있었습니다.
        3. 금액 컬럼의 CHECK 제약과 감사 테이블의 append-only 성질이 깨지지 않는지 봐주세요.
        4. 정책 행은 불변입니다. APPROVED·ACTIVE·RETIRED 정책을 수정·삭제하지 않고
           새 version_no로 만드는지 확인해주세요. (운영정책서 제49조)

    - path: "src/main/resources/mapper/**"
      instructions: |
        1. 바인드 파라미터(#{})를 쓰는지 확인해주세요. ${} 사용은 지적해주세요.
        2. 조회 조건이 정책 유효기간·활성 여부(active_yn)·상태값을 빠뜨리지 않는지 봐주세요.
        3. 금액 집계 쿼리는 상세행을 먼저 반올림한 뒤 합산하는 규칙과 어긋나지 않는지 봐주세요.

    - path: "src/test/**"
      instructions: |
        1. 테스트 이름과 주석에 관련 요구사항 ID(FGC-FUN-xxx)나 규제 ID(REG-xx)를 남기면
           추적성이 올라갑니다. (FGC-QUR-001)
        2. 경계값(1,200% 한도 직전·직후, 초년도/차년도 경계)이 빠져 있으면 지적해주세요.

  # ---------------------------------------------------------------- #
  # 자동 리뷰 트리거 설정
  # ---------------------------------------------------------------- #
  auto_review:
    # 2026-08-13 yslee - Draft 및 스택형 PR도 자동 리뷰 대상에 포함
    # 기존 코드: enabled가 주석 처리되고 drafts/base_branches가 없어 CodeRabbit 기본값에 의존
    # 문제: Draft PR은 기본적으로 제외되고 기본 브랜치가 아닌 feature 브랜치 대상 PR도 자동 리뷰에서 빠질 수 있음
    # 개선: 자동 리뷰를 명시적으로 활성화하고 Draft와 모든 base 브랜치를 허용
    enabled: true
    drafts: true
    base_branches:
      - ".*"
    # 이미 리뷰가 진행된 PR에 새로운 커밋이 추가될 때, 변경된 부분에 대해서만 자동으로 리뷰를 진행할지 여부입니다.
    # false로 두면 "Review skipped: incremental reviews are disabled"가 뜨면서
    # 첫 리뷰 이후에 밀어넣은 커밋은 아무도 검토하지 않은 채 머지됩니다.
    # 리뷰 범위가 "변경된 부분"으로 한정되므로 비용도 크지 않아 켭니다.
    auto_incremental_review: true

# ---------------------------------------------------------------- #
# 채팅 기능 설정
# ---------------------------------------------------------------- #
chat:
  # 사용자가 @coderabbitai 태그를 지정하지 않아도 자동으로 답글을 달 수 있도록 설정합니다.
  auto_reply: true

# ---------------------------------------------------------------- #
# CodeRabbit의 지식 기반(Knowledge Base) 설정
# ---------------------------------------------------------------- #
knowledge_base:
  # 웹 검색을 통해 최신 정보나 문서를 참조할 수 있도록 허용할지 여부입니다.
  web_search:
    enabled: true
  # CodeRabbit이 대화나 리뷰를 통해 학습한 내용을 어디에 저장하고 참조할지 범위를 설정합니다. 'local'은 현재 레포지토리에 한정됨을 의미합니다.
  learnings:
    scope: local
  # 이슈 정보를 참조할 범위를 설정합니다.
  issues:
    scope: local
  # 풀 리퀘스트 정보를 참조할 범위를 설정합니다.
  pull_requests:
    scope: local
