# .github/workflows/llm-live-check.yml
# 저장소 시크릿 OPENAI_API_KEY 로 실제 OpenAI 호출(챗봇 질문 답변 경로)을 확인한다.
# 비용이 들고 시크릿을 쓰므로 수동 실행(workflow_dispatch)만 허용한다 — PR·push 로는 돌지 않는다.
# 시크릿 값은 어디에도 출력하지 않는다(테스트도 키·본문을 로그에 남기지 않는다).
name: LLM live check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-live-check
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check that the secret is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY 시크릿이 비어 있습니다."
            exit 1
          fi
          echo "시크릿 길이: ${#OPENAI_API_KEY}"

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle (의존성·빌드 캐시)
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Run live LLM test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FGC_LLM_LIVE: 'true'
        run: ./gradlew test --tests 'com.susukkang.fgc.compare.service.CompareAskLiveTest'

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llm-live-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 3
