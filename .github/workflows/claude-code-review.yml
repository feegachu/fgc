name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # 이 워크플로 파일 자체는 paths에 넣지 않는다.
    # GitHub은 코드리뷰 워크플로가 기본 브랜치 버전과 내용이 다르면 실행을 건너뛴다
    # ("Workflow validation failed"). 워크플로만 바뀐 PR은 어차피 스킵되므로 의미가 없다.
    paths:
      - "src/**"
      - "frontend/**"           # 2차 React (#401)
      - "build.gradle"
      - "settings.gradle"

# 같은 PR에서 리뷰가 겹쳐 돌면 같은 지적이 중복으로 달린다. 새 push가 오면 진행 중인 리뷰를 취소한다.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0        # 이전 push와 base 브랜치를 비교하기 위해 전체 이력을 받는다

      # push로 들어온 커밋 중 base 브랜치에 없는 "이 PR 자신의" 비병합 커밋이 없으면
      # (develop 병합만 한 push) 리뷰를 건너뛴다. 판정할 수 없으면(강제 push 등) 리뷰한다.
      - name: Skip review for base-branch-only pushes
        id: gate
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$ACTION" != "synchronize" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          own=$(git rev-list --no-merges "${BEFORE}..${AFTER}" "^origin/${BASE}" | wc -l)
          echo "이번 push의 PR 고유 커밋: ${own}건"
          if [ "$own" -eq 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # 해결된 이전 지적의 스레드를 닫는 도우미(CodeRabbit 처럼). Claude 에게 GraphQL 전체 권한을 주지 않고
      # 이 스크립트만 허용한다 — 이 PR 에서 claude[bot] 이 연 스레드만 닫을 수 있고, 저장소·PR 번호는 여기서 고정된다.
      # PR 코드가 바꿀 수 없도록 체크아웃 밖(RUNNER_TEMP)에 만든다.
      - name: Prepare review-thread helper
        if: steps.gate.outputs.run == 'true'
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          helper="$RUNNER_TEMP/claude-review-threads.sh"
          cat > "$helper" <<'SCRIPT'
          #!/usr/bin/env bash
          # Claude 리뷰가 이 PR에 단 인라인 스레드만 조회·해결한다.
          # 저장소·PR 번호는 워크플로가 이 파일을 만들 때 고정한다(인자로 바꿀 수 없다).
          set -euo pipefail
          REPO="__REPO__"
          PR="__PR__"
          BOT_LOGIN="claude"   # GraphQL은 claude[bot]을 "claude"로 돌려준다

          case "${1:-}" in
            list)
              gh api graphql -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$PR" -f query='
                query($owner: String!, $name: String!, $pr: Int!) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $pr) {
                      reviewThreads(first: 100) {
                        nodes {
                          id isResolved isOutdated path line originalLine
                          comments(first: 1) { nodes { author { login } body } }
                        }
                      }
                    }
                  }
                }' --jq ".data.repository.pullRequest.reviewThreads.nodes[]
                  | select(.isResolved | not)
                  | select(.comments.nodes[0].author.login == \"$BOT_LOGIN\")
                  | {id, path, line: (.line // .originalLine), outdated: .isOutdated,
                     body: .comments.nodes[0].body[0:400]}"
              ;;
            resolve)
              id="${2:-}"
              [[ "$id" =~ ^PRRT_[A-Za-z0-9_-]+$ ]] || { echo "스레드 ID 형식이 아님: $id" >&2; exit 2; }
              meta=$(gh api graphql -f id="$id" -f query='
                query($id: ID!) {
                  node(id: $id) {
                    ... on PullRequestReviewThread {
                      isResolved
                      pullRequest { number repository { nameWithOwner } }
                      comments(first: 1) { nodes { author { login } } }
                    }
                  }
                }' --jq '.data.node | "\(.pullRequest.repository.nameWithOwner) \(.pullRequest.number) \(.comments.nodes[0].author.login) \(.isResolved)"')
              read -r repo pr author resolved <<<"$meta"
              if [[ "$repo" != "$REPO" || "$pr" != "$PR" || "$author" != "$BOT_LOGIN" ]]; then
                echo "이 PR의 Claude 스레드가 아니라 닫지 않음: $meta" >&2
                exit 3
              fi
              if [[ "$resolved" == "true" ]]; then
                echo "이미 해결됨: $id"
                exit 0
              fi
              gh api graphql -f id="$id" -f query='
                mutation($id: ID!) {
                  resolveReviewThread(input: { threadId: $id }) { thread { id isResolved } }
                }' --jq '.data.resolveReviewThread.thread | "해결 처리: \(.id) isResolved=\(.isResolved)"'
              ;;
            *)
              echo "사용법: $0 list | $0 resolve <스레드ID>" >&2
              exit 2
              ;;
          esac
          SCRIPT
          sed -i "s|__REPO__|${REPO}|; s|__PR__|${PR_NUMBER}|" "$helper"
          chmod 0555 "$helper"

      # 첫 리뷰인지는 모델이 코멘트를 읽고 짐작하게 두지 않고 여기서 확정한다(#444: 지적 0건이면 흔적이 남지 않았다).
      # 종합 요약은 PR 대화 코멘트(issue comment)다. 실패하면 "첫 리뷰"로 본다 — 요약이 한 건 더 남는 쪽이 안전하다.
      - name: Detect first review
        id: first
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # --paginate 는 페이지마다 숫자를 한 줄씩 내므로 awk 로 더한다.
          count=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '[.[] | select(.user.login == "claude[bot]")] | length' 2>/dev/null \
            | awk '{s+=$1} END {print s+0}') || count=0
          echo "이 PR 의 기존 Claude 종합 요약: ${count}건"
          if [ "$count" -eq 0 ]; then echo "first=true" >> "$GITHUB_OUTPUT"; else echo "first=false" >> "$GITHUB_OUTPUT"; fi

      - name: Run Claude Code Review
        id: claude-review
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            FIRST REVIEW: ${{ steps.first.outputs.first }}

            이 PR을 FGC 도메인 문서 기준으로 검토한다. PR 브랜치는 이미 체크아웃되어 있다.

            ## 규칙이 어디 있는지 (여기만 보면 된다)
            | 판단할 것 | 볼 파일 | 찾는 법 |
            |---|---|---|
            | 요구사항·인수조건 | docs/FGC_요구사항명세서_v2_2_2_정합성교정_FUN_기능_요구사항.CSV | `검증기준(인수조건)` 열 |
            | 규제 위반 | docs/07_규제조문표_v0.2.1.md | REG-01 ~ REG-24 |
            | 금액 반올림 | docs/FGC_가상_GA_운영정책서_v1_0.md | 제17조의2 (L408~424) |
            | 초년도/차년도 경계 | docs/FGC_가상_GA_운영정책서_v1_0.md, docs/FGC_정규화_입력데이터_시드데이터_명세서_v1_0.md | `초년도` grep |
            | API 계약 | docs/05_인터페이스정의서_v2_0.md | IF-API-xx |
            | 화면 필드 | docs/FGC_화면정의서_v2_0.md | FGC-UI-xxx-Wxx |
            | ERD·DB Schema 정합성 | docs/FGC_정규화_입력데이터_시드데이터_명세서_v1_0.md, src/main/resources/db/migration/*.sql | 명세의 `ERD·요구사항 매핑`과 변경 테이블·컬럼명 grep |

            ## 읽는 방법 (중요)
            문서 총합이 300KB가 넘는다. 통째로 읽지 마라.
            1) `gh pr view`, `gh pr diff`로 변경 범위를 파악하고
               PR 제목·브랜치명에서 요구사항 번호를 찾는다.
            2) 요구사항 ID 형식은 `FGC-FUN-047`이다.
               `grep -rn "FUN-047" docs/`로 해당 ID만 찾아 그 주변만 읽는다.
               (`-r` 없이 디렉터리를 주면 "Is a directory"로 아무것도 찾지 못한다.)
            3) 위 표에서 지금 필요한 행만 골라 grep한다. 나머지 파일은 열지 마라.

            ## 검토 항목
            1. 구현이 대상 FGC-FUN-xxx의 `검증기준(인수조건)`을 만족하는가
            2. 계산 로직이 REG-01~24를 어기지 않는가 (1,200% 한도·분급·환수 특히)
            3. 금액 반올림이 **상세행 단위(수수료 규칙 1행·계약 1건·수취인 1명·회차 1개)로
               먼저 원 단위 HALF_UP** 후 합산하는가. 합계를 먼저 내고 반올림하면 위반이다.
            4. 초년도/차년도 경계 판정이 명세와 일치하는가
            5. API 시그니처·응답이 인터페이스정의서와 일치하는가
            6. 화면정의서가 요구하는 필드를 응답이 실제로 제공하는가
            7. DB 관련 변경이 있으면 다음 항목이 서로 일치하는가
               - 정규화·시드 명세의 ERD·요구사항 매핑
               - Flyway 마이그레이션의 테이블·컬럼·타입·NULL/FK/UNIQUE 제약
               - MyBatis SQL/resultMap 또는 JPA 엔티티·JPQL과 Java 도메인·DTO 필드
               기존 마이그레이션 전체를 기준으로 PR 적용 후 유효 스키마를 판단한다.
            8. 데이터를 읽고 쓰는 코드(Mapper·Repository·엔티티·@Transactional 서비스·
               Flyway·배치 Writer)가 바뀌면 데이터 정합성을 검토한다. 실행하지 않고 읽어서
               판단하므로 확정할 수 없는 것은 "의심 — 테스트로 확인 필요"로 쓴다.
               [공통 — 신규·수정 CRUD 모두]
               - 조회 후 판단·저장 사이에 다른 요청이 끼어들 수 있는가 (check-then-act)
                 → 행 잠금·조건부 UPDATE·UNIQUE 제약 중 하나로 막는가
               - 같은 요청의 재시도·중복 실행에 멱등한가 (업무키 UNIQUE, ON CONFLICT,
                 이미 처리됨 판정) — 금액·지급·전표처럼 두 번 반영되면 안 되는 데이터는 필수
               - UPDATE·DELETE의 WHERE가 의도한 행만 고르는가, 갱신 건수를 검사하는가
               - 한 업무 단위의 여러 쓰기(본문·상세·이력·감사 로그·상태)가 같은 트랜잭션에서
                 함께 커밋·롤백되는가. 의도적으로 분리(REQUIRES_NEW·afterCompletion)했다면 이유가 있는가
               - @Transactional 전파·readOnly·noRollbackFor 경계가 맞는가, 예외를 잡고 삼켜
                 rollback-only·부분 커밋이 생기지 않는가
               - 확정·마감된 데이터를 덮어쓰지 않고 새 버전·정정으로 처리하는가 (DB 가드 트리거와 일치)
               - 금액은 BigDecimal과 DB numeric scale이 일치하고 반올림 위치가 3번 규칙과 같은가
               [JPA·네이티브 SQL]
               - 잠금(FOR UPDATE·PESSIMISTIC) 뒤 재조회를 findById 등 엔티티로 해서
                 1차 캐시의 이전 상태를 읽지 않는가 (DTO 투영·refresh로 DB를 다시 보는가)
               - 네이티브·벌크 변경 전후 flush/clear가 있고, clear 이후 분리된 엔티티를
                 고쳐 저장(더티 체킹 유실)하는 코드가 없는가
               - 대량 INSERT가 건별 INSERT로 바뀌지 않았는가 (IDENTITY 키는 JDBC 배치 불가)
               - 입력값은 바인딩 파라미터로만 전달되는가 (쿼리 문자열에 값을 이어 붙이지 않는가)
               [기존 Mapper를 대체하는 전환 PR] diff에서 삭제·변경된 Mapper XML 줄과 새 코드 줄을
               양쪽 모두 밝힌다.
               - 조건부 상태 전이(WHERE 조건·갱신 건수 판정)와 커밋/롤백 범위가 기존과 같은가
               - 정렬·NULL·COALESCE·LIKE·BigDecimal scale·OffsetDateTime 오프셋 등
                 조회 결과 표현이 기존과 같은가
               [테스트] 위 위험(동시성·멱등·롤백 포함)을 검증하는 PostgreSQL 통합 테스트가
               PR에 있는가. 없으면 어떤 시나리오가 빠졌는지 구체적으로 지적한다.

            ## 규칙
            - 지적마다 근거 파일 경로와 줄 번호를 밝힌다. 예: docs/07_규제조문표_v0.2.1.md:412
            - ERD·Schema 지적은 불일치하는 양쪽 파일과 줄 번호를 모두 밝힌다.
            - 근거를 못 찾으면 추측하지 말고 "근거 없음 — 확인 필요"라고 쓴다.
            - 코드 스타일·포맷·네이밍은 지적하지 않는다 (CodeRabbit 담당).
            - 문제가 없으면 없다고 짧게 쓴다. 억지로 만들지 않는다.
            - 한국어로 작성한다.

            ## 이전 리뷰와 중복 금지 (먼저 할 것)
            이 PR은 push마다 다시 검토된다. 검토를 시작하기 전에 이미 달린 코멘트를 읽는다.
            - 인라인: `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
            - 종합 요약: `gh pr view ${{ github.event.pull_request.number }} --comments`
            - 아직 열린 내 인라인 스레드: `${{ runner.temp }}/claude-review-threads.sh list` (스레드 ID·파일·줄·첫 코멘트)
            - `gh api`는 위 조회(GET)에만 쓴다. 코멘트 작성·수정·삭제에 쓰지 않는다.
            규칙:
            - 이전에 단 지적과 같은 내용은 인라인 코멘트를 다시 달지 않는다.
            - 열린 내 스레드는 하나도 빠짐없이 `gh pr diff`와 현재 파일을 읽고 판정한다. 판정 없이 끝내지 않는다.
            - 이전 지적이 현재 코드에서 해결됐으면 `${{ runner.temp }}/claude-review-threads.sh resolve <스레드ID>`로
              그 스레드를 닫고, 새 인라인 없이 요약에 "해결됨: <지적 요지> (<파일:줄>)"로만 적는다.
              닫기가 실패하면 요약에 "해결됨(스레드 닫기 실패): …"로 적는다.
            - 해결 판정은 지적한 문제가 현재 코드에서 실제로 사라졌을 때만 한다. 작성자의 답글·설명만 있고 코드가
              그대로면 스레드를 닫지 않는다(사람이 판단해 닫는다).
            - 이전 지적이 아직 남아 있으면 스레드를 닫지 않고 요약에 "미해결: <지적 요지>" 한 줄로만 적는다.
            - 인라인 코멘트는 이번에 처음 발견한 지적에만 단다.
            - `FIRST REVIEW: true`(이 PR 에 내 종합 요약이 아직 없음)이면 지적이 없어도 종합 요약을 반드시 남긴다.
              지적이 없으면 "검토 범위: <확인한 파일·관점> / 지적 없음"처럼 무엇을 봤는지 짧게 적는다.
              요약이 없으면 리뷰가 실패한 것인지 문제가 없었던 것인지 구분할 수 없다.
            - `FIRST REVIEW: false`이고 새 지적이 없고 열린 내 스레드도 없으면 종합 요약을 남기지 않는다.
              열린 내 스레드가 하나라도 있었으면 해결·미해결 판정을 담은 종합 요약을 반드시 남긴다.

            ## 출력
            - 특정 코드 줄의 문제는 mcp__github_inline_comment__create_inline_comment
              (confirmed: true)로 인라인 코멘트를 단다.
            - 마지막에 `gh pr comment`로 종합 요약 1건을 남긴다.
              단, 위 중복 금지 규칙의 생략 조건(첫 리뷰가 아니고 새 지적 없음·상태 변화 없음)이면 남기지 않는다.
            - 반드시 GitHub 코멘트로 출력한다. 메시지로만 끝내지 마라.

          claude_args: |
            --model claude-sonnet-5-5
