name: Pico Guide API Secret Smoke

on:
  workflow_dispatch:
    inputs:
      confirm_paid_call:
        description: 'Authorize two conversational turns, four gpt-4o-mini provider calls'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pico-guide-api-secret-smoke
  cancel-in-progress: false

jobs:
  assistant-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
      - name: Scoped conversation, current-state entry and payment observer regression
        run: npx vitest run src/features/transaction/transaction-form.test.tsx src/features/transaction/payment-guide.test.ts src/features/assistant/PicoLiveConversation.test.tsx src/features/assistant/PicoGuideStartButton.test.tsx --maxWorkers=2
      - name: Normal frontend build and generated API check
        run: npm run build && npm run check:api
  assistant-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Scoped assistant regression with isolated PostgreSQL
        run: |
          ./gradlew test --no-daemon --console=plain \
            --tests '*PicoAskServiceTest' --tests '*PicoAskControllerTest' \
            --tests '*PicoGuideStartServiceTest' --tests '*PicoGuideControllerTest' \
            --tests '*CalculationProofServiceTest' --tests '*PaymentCalculationIntegrationTest' \
            --tests '*PaymentCalculationControllerTest' --tests '*AssistantCalculationSourcesTest' \
            --tests '*RoleApiAuthorizationMatrixIntegrationTest.everyWriteMappingHasAMatrixRow'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: assistant-scoped-test-results
          path: build/test-results/test/TEST-*.xml
          retention-days: 1
  verify-guide-api:
    needs: [assistant-regression, assistant-ui]
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_paid_call == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Two synthetic conversational turns through secured controller and real service
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FGC_PICO_GUIDE_LIVE_SMOKE: 'true'
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY repository secret is missing.' >&2
            exit 1
          fi
          ./gradlew test --tests '*PicoGuideApiLiveSmokeTest' --no-daemon --console=plain
      - name: Publish metrics only
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source = Path('build/pico-guide-api-smoke/result.json')
          if not source.exists():
              raise SystemExit('No API result was produced; check build status without dumping environment.')
          raw = json.loads(source.read_text())
          keys = ('endpoint', 'checksPassed', 'source', 'decision', 'evidenceCount', 'fallbackReason',
                  'model', 'status', 'errorCode', 'inputTokens', 'outputTokens', 'latencyMs', 'providerCalls', 'followupPassed',
                  'evidenceWorkflows', 'followupEvidenceWorkflows', 'followupDecision', 'entryStep')
          safe = {key: raw.get(key) for key in keys}
          destination = Path('build/pico-guide-api-smoke/published-metrics.json')
          destination.write_text(json.dumps(safe, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Pico guide API: secured MVC + real service/gateway; synthetic input; database mocked.\n\n')
              for key, value in safe.items():
                  summary.write(f'- {key}: {value}\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: pico-guide-api-smoke-metrics
          path: build/pico-guide-api-smoke/published-metrics.json
          if-no-files-found: ignore
          retention-days: 1
