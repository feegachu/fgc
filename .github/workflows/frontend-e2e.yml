name: Frontend E2E

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
  schedule:
    # Daily 06:00 Asia/Seoul, on the default branch (develop).
    - cron: '0 21 * * *'

concurrency:
  group: frontend-e2e-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.plan.outputs.ui }}
      server: ${{ steps.plan.outputs.server }}
      stability: ${{ steps.plan.outputs.stability }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Test change selection and required-check policy
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_e2e_policy.py' -v
      - name: Select suites from the complete change set
        id: plan
        run: python3 .github/scripts/e2e_policy.py plan

  negative:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
        working-directory: frontend
      - name: Prove permission regression detection and missing-backend diagnostics
        run: npm run test:e2e:negative
        working-directory: frontend
      - name: Upload expected failures and unchanged-source evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-negative-evidence
          path: frontend/e2e-artifacts/negative/
          if-no-files-found: error
          retention-days: 7
  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
        working-directory: frontend
      - run: npm run check:e2e
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser UI regression tests (once)
        run: npm run test:e2e
        working-directory: frontend
      - name: Upload UI evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-ui-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  real-server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fgc_e2e
          POSTGRES_USER: fgc_e2e
          POSTGRES_PASSWORD: fgc_e2e_only
        ports:
          - 55418:5432
        options: >-
          --label com.fgc.e2e=418
          --health-cmd "pg_isready -U fgc_e2e -d fgc_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./gradlew bootJar
      - run: npm ci --no-audit
        working-directory: frontend
      - run: npm run check:e2e
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Real-server demo tests (once for PR, push and manual runs)
        if: needs.changes.outputs.stability != 'true'
        run: npm run test:e2e:demo
        working-directory: frontend
        env:
          FGC_E2E_DB_CONTAINER: ${{ job.services.postgres.id }}
      - name: Three consecutive real-server demo runs (no retries)
        if: needs.changes.outputs.stability == 'true'
        run: npm run test:e2e:stable
        working-directory: frontend
        env:
          FGC_E2E_DB_CONTAINER: ${{ job.services.postgres.id }}
      - name: Upload browser reports, screenshots, traces and backend diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-real-server-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e-artifacts/
            !frontend/**/demo-seed.sql
          retention-days: 7

  # Keep this exact check name: branch protection requires playwright.
  # Always evaluate failures and intentional skips instead of inheriting a skipped job.
  playwright:
    needs: [changes, negative, ui, real-server]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate all required results against the execution plan
        env:
          E2E_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/e2e_policy.py gate
