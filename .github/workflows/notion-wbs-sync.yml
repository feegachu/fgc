name: Sync Notion WBS

on:
  pull_request_target:
    types: [closed]
    branches: [develop]
  issues:
    types: [closed, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without updating Notion
        type: boolean
        default: true

# Only default-branch automation is executed; PR code and artifacts are never used.
permissions:
  contents: read
  issues: read
  pull-requests: read

# Keep explicit reopen events and prevent previews from replacing queued writes.
concurrency:
  group: notion-wbs-sync-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'preview' || 'apply' }}
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test synchronization rules
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_notion_wbs_sync.py' -v
      - name: Reconcile merged issues with Notion
        env:
          GH_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: 37b2f20a-c4dd-8210-b93b-01c8ea93ec5c
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_WBS_DATA_SOURCE_ID }}
          NOTION_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python3 -B .github/scripts/notion_wbs_sync.py
