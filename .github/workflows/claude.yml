name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 기본값 360분 — 멈춘 실행이 러너를 6시간 잡지 않게 한다
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          #
          # 아래 설정은 Gradle 테스트 명령을 "미리 허용(allow)"해서,
          # Claude가 매번 승인을 기다리지 않고 바로 ./gradlew test 를 실행하게 합니다.
          # - Bash(./gradlew test)     : ./gradlew test  (옵션 없는 그대로의 명령)
          # - Bash(./gradlew test:*)   : ./gradlew test  뒤에 옵션이 붙는 경우 (예: --info, --stacktrace)
          # - Bash(gh issue view:*) 등 : PR이 연결한 이슈 본문(FUN 외 요구사항 원문)과 PR 정보를 읽기 위한 조회 전용 명령
          # --append-system-prompt     : CLAUDE.md 는 gitignore 대상이라 CI 에 없다. 도메인 문서 지도와 근거 규칙을 여기서 준다.
          #                              claude_args 는 셸 규칙으로 파싱되므로 아래 문구에 큰따옴표·달러 기호를 쓰지 않는다.
          claude_args: |
            --model claude-opus-5-5
            --allowed-tools "Bash(./gradlew test),Bash(./gradlew test:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
            --append-system-prompt "FGC 도메인 질문에 답할 때 다음 문서를 근거로 쓴다. 통째로 읽지 말고 ID로 grep 한 뒤 주변만 읽는다.
            - 요구사항·인수조건(FUN): docs/FGC_요구사항명세서_v3_0_FUN_기능_요구사항.csv 의 검증기준(인수조건)·진행 여부 열
            - FUN 외 요구사항(SER·TER·SIR·ECR·DAR·PER 등): PR이 연결한 이슈 본문의 요구사항 원문 블록 (gh issue view)
            - 규제: docs/07_규제조문표_v0.2.1.md (REG-01~REG-24)
            - 금액 반올림·초년도 경계: docs/FGC_가상_GA_운영정책서_v1_0.md 의 제17조의2, 초년도 grep
            - API 계약: docs/05_인터페이스정의서_v3_0.md 의 IF-API-xx, 2차 상세는 4-4-x 절
            - 화면 필드: docs/FGC_화면정의서_v3_0.md 의 FGC-UI-xxx-Wxx
            - DB·시드: docs/FGC_정규화_입력데이터_시드데이터_명세서_v1_0.md 와 src/main/resources/db 아래 Flyway 파일
            - 배치 Step: docs/06_배치_Step_협업계약.md
            위 파일이 없으면 docs/ 아래에서 같은 이름의 최신 버전을 찾는다.
            답변의 근거에는 파일 경로와 줄 번호, 또는 요구사항 ID·REG-xx를 붙인다. 근거를 찾지 못하면 추측하지 말고 근거 없음 — 확인 필요 라고 쓴다.
            요청이 확인·판정이면 코드를 고치지 않는다. 한국어로 답한다."