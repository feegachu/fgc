# .github/workflows/ci.yml
name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]     # 머지 후 develop 검증 + README 뱃지 소스

# PR: 같은 PR에 새 푸시가 오면 진행 중 실행을 취소한다(러너 절약).
# develop·main push: run마다 별도 그룹이라 서로 취소·대체하지 않는다 — 머지마다 검증 결과
# (와 2차 이미지 publish)가 남아야 한다. 그룹을 ref로 두면 cancel-in-progress가 false여도
# GitHub가 그룹당 "실행 1 + 대기 1"만 두어, 연속 머지 때 대기 중이던 run이 최신 run으로 대체(취소)된다.
# 순서가 중요한 단계(publish 등)가 생기면 그 job에만 따로 concurrency(취소 없이)를 건다.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write        # JUnit 리포트를 PR 체크로 생성

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_checks: ${{ steps.plan.outputs.run_checks }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Test documentation selection and required-check policy
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*policy.py' -v
      - name: Select verification from the complete change set
        id: plan
        run: python3 .github/scripts/e2e_policy.py ci-plan

  # ⚠️ 이 job의 체크 이름은 'build'이며, 브랜치 보호의 필수 체크로 등록되어 있다.
  # job id를 바꾸거나 name: 을 새로 붙이면 체크 이름이 따라 바뀌고,
  # 보호 규칙이 찾는 이름이 사라져 모든 PR의 머지가 영구 차단된다.
  # (name: 을 지정하면 job id가 아니라 그 name이 체크 이름이 된다.)
  build:
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # DB는 서비스 컨테이너가 아니라 test 프로필의 Testcontainers(jdbc:tc:postgresql:17)가 띄운다.
    # 로컬과 같은 설정 하나(application-test.yml)만 쓰며, 시드 위치(db/migration+db/demo)도 거기 있다.
    # 테스트 fork 병렬(maxParallelForks=2)은 PR #502에서 측정했으나 4코어 러너에서 :test 시간이 줄지 않아 넣지 않았다.

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate verification plan
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/e2e_policy.py ci-gate

      - name: Set up Java 21
        if: needs.changes.outputs.run_checks == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle (의존성·빌드 캐시)
        if: needs.changes.outputs.run_checks == 'true'
        # v6는 캐시 컴포넌트의 별도 이용약관 검토가 필요해 Node 24 기반 최신 v5를 사용한다.
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Build and test
        if: needs.changes.outputs.run_checks == 'true'
        run: ./gradlew build

      # Dependabot/fork PR의 토큰은 read-only이므로, 권한 있는 별도 workflow_run이
      # 이 아티팩트를 읽어 동일 커밋에 "테스트 결과" 체크를 게시한다.
      - name: Upload JUnit XML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.run_checks == 'true' }}
        with:
          name: junit-test-results
          path: '**/build/test-results/test/TEST-*.xml'
          if-no-files-found: ignore
          retention-days: 1

      - name: Publish test report (쓰기 가능한 실행)
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6
        if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.run_checks == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: 테스트 결과
          detailed_summary: true

      # Dependabot/fork PR에서도 현재 job summary와 로그 annotation은 즉시 남긴다.
      # 별도 체크 게시 자체는 test-report.yml의 workflow_run이 담당한다.
      - name: Annotate test report (Dependabot/fork PR)
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6
        if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.run_checks == 'true' && github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository) }}
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          annotate_only: true
          detailed_summary: true

      - name: Upload HTML test report (실패 분석용)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() && needs.changes.outputs.run_checks == 'true' }}
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  # React 프론트(frontend/, #401). build와 다른 러너에서 병렬로 돈다.
  # 브랜치 보호의 두 번째 필수 체크로 등록한다 — build와 같은 이유로 job id·name: 을 바꾸지 않는다.
  # workflow 단위 paths 필터를 쓰지 않는다. 건너뛴 workflow는 필수 체크를 보고하지 않아 머지가 막힌다.
  frontend:
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate verification plan
        working-directory: .
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/e2e_policy.py ci-gate

      - name: Set up Node (frontend/.nvmrc)
        if: needs.changes.outputs.run_checks == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Audit runs once in npm-audit; registry outages must not stall every installer.
      - run: npm ci --no-audit
        if: needs.changes.outputs.run_checks == 'true'
      - run: npm run check:api
      - run: npm run check:guide-features
        if: needs.changes.outputs.run_checks == 'true'
      - run: npm run check:e2e
        if: needs.changes.outputs.run_checks == 'true'
      - run: npm run lint
        if: needs.changes.outputs.run_checks == 'true'
      - run: npm run test:coverage
        if: needs.changes.outputs.run_checks == 'true'
      - name: Upload frontend coverage
        if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.run_checks == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 7
      # tsc -b(타입 검사) 후 vite build
      - run: npm run build
        if: needs.changes.outputs.run_checks == 'true'

  # Preserve the previous informational audit policy; this is not a merge/publish gate.
  npm-audit:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - name: Test audit result classification
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_npm_audit_summary.py' -v
      - name: Audit locked dependencies (informational, bounded to 60 seconds)
        id: audit
        continue-on-error: true
        working-directory: frontend
        run: |
          status=0
          timeout 60s npm audit --package-lock-only --json --fetch-timeout=15000 --fetch-retries=0 > npm-audit.json 2> npm-audit.stderr || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Report findings separately from registry failures
        if: ${{ !cancelled() }}
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: python3 .github/scripts/npm_audit_summary.py
      - name: Upload npm audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-audit-report
          path: |
            frontend/npm-audit.json
            frontend/npm-audit.stderr
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [changes, build, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/feegachu/fgc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both images
        if: needs.changes.outputs.run_checks == 'true'
        env:
          # Public feature flag only. No API keys are available to image builds.
          PICO_ASSISTANT_AI: ${{ vars.FGC_ASSISTANT_AI_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          # docker build는 .containerignore를 읽지 않는다 (위 주의 참고)
          cp .containerignore .dockerignore
          case "$PICO_ASSISTANT_AI" in true|false) ;; *) echo 'FGC_ASSISTANT_AI_ENABLED must be true or false' >&2; exit 1 ;; esac
          for app in api web; do
            web_build_args=()
            if [[ "$app" == web ]]; then
              web_build_args+=(--build-arg "VITE_ASSISTANT_AI=$PICO_ASSISTANT_AI")
            fi
            docker build --pull "${web_build_args[@]}" \
              --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              -f "Containerfile.$app" -t "$REGISTRY/$app:sha-$GITHUB_SHA" .
          done
      - name: Scan API
        if: needs.changes.outputs.run_checks == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/feegachu/fgc/api:sha-${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore
          format: table
      - name: Scan WEB
        if: needs.changes.outputs.run_checks == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/feegachu/fgc/web:sha-${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore
          format: table
      - name: Push only after both scans pass
        if: needs.changes.outputs.run_checks == 'true'
        run: |
          set -euo pipefail
          for app in api web; do
            docker push "$REGISTRY/$app:sha-$GITHUB_SHA"
          done
      # 문서 전용 push(#615)는 이미지를 새로 빌드하지 않는다. 그래도 Jenkins dev-fgc는 develop HEAD의
      # sha 태그를 기다리므로(Jenkinsfile.fgc), 직전 커밋 이미지에 같은 digest로 태그만 더한다.
      - name: Tag previous images (documentation-only push)
        if: needs.changes.outputs.run_checks != 'true'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # 직전 push의 publish가 아직 진행 중일 수 있어 최대 20분 기다린다.
          for n in $(seq 1 80); do
            if docker buildx imagetools inspect "$REGISTRY/api:sha-$BEFORE" > /dev/null 2>&1 \
               && docker buildx imagetools inspect "$REGISTRY/web:sha-$BEFORE" > /dev/null 2>&1; then
              for app in api web; do
                # --prefer-index=false: 새 index로 감싸지 않고 그대로 복사해 digest를 유지한다.
                docker buildx imagetools create --prefer-index=false \
                  -t "$REGISTRY/$app:sha-$GITHUB_SHA" "$REGISTRY/$app:sha-$BEFORE"
              done
              exit 0
            fi
            sleep 15
          done
          echo "::error::직전 커밋 $BEFORE 의 이미지가 20분 안에 없습니다. 그 커밋의 CI publish 결과를 확인하세요."
          exit 1
