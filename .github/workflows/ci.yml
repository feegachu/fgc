# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fgc
          POSTGRES_USER: fgc
          POSTGRES_PASSWORD: fgc_local_only
          TZ: Asia/Seoul
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fgc -d fgc"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.CI_DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.CI_DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          # application-local.yml(git 미포함)에만 있던 시드 데이터 위치를 CI에도 적용
          SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
        run: ./gradlew clean build