# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]     # 머지 후 develop 검증 + README 뱃지 소스

# 같은 브랜치에 새 푸시가 오면 진행 중 실행을 취소한다(러너 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write        # JUnit 리포트를 PR 체크로 생성

jobs:
  # ⚠️ 이 job의 체크 이름은 'build'이며, 브랜치 보호의 필수 체크로 등록되어 있다.
  # job id를 바꾸거나 name: 을 새로 붙이면 체크 이름이 따라 바뀌고,
  # 보호 규칙이 찾는 이름이 사라져 모든 PR의 머지가 영구 차단된다.
  # (name: 을 지정하면 job id가 아니라 그 name이 체크 이름이 된다.)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17          # docker-compose.yml과 동일 버전 (FGC-ECR-003)
        env:
          POSTGRES_DB: fgc
          POSTGRES_USER: fgc
          POSTGRES_PASSWORD: fgc_local_only   # 로컬/CI 전용. 실제 비밀번호가 아님
          TZ: Asia/Seoul
        # docker-compose.yml은 "5433:5432"인데 여기가 5432인 건 의도된 차이다.
        # 왼쪽은 호스트 포트일 뿐이고 컨테이너 안 PostgreSQL은 양쪽 다 5432로 뜬다.
        # 로컬이 5433인 이유는 개발자 PC에 이미 깔린 PostgreSQL(5432)과 겹치지 않게
        # 비키는 것이고, 러너는 매번 새 VM이라 5432가 비어 있어 피할 이유가 없다.
        # ⚠️ 이 값을 바꾸면 아래 SPRING_DATASOURCE_URL의 포트도 같이 바꿔야 한다.
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fgc -d fgc"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle (의존성·빌드 캐시)
        # v6는 캐시 컴포넌트의 별도 이용약관 검토가 필요해 Node 24 기반 최신 v5를 사용한다.
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        env:
          # 위 services가 띄운 컨테이너를 그대로 가리킨다.
          # 값이 이 파일에 이미 평문으로 있으므로 secrets로 감출 실익이 없다.
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fgc
          SPRING_DATASOURCE_USERNAME: fgc
          SPRING_DATASOURCE_PASSWORD: fgc_local_only
          # 시드까지 올려야 통합테스트가 돈다.
          # migration/demo 간 버전 중복도 여기서 걸린다 (PR #30 재발 방지).
          SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
        run: ./gradlew build

      # Dependabot/fork PR의 토큰은 read-only이므로, 권한 있는 별도 workflow_run이
      # 이 아티팩트를 읽어 동일 커밋에 "테스트 결과" 체크를 게시한다.
      - name: Upload JUnit XML
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-test-results
          path: '**/build/test-results/test/TEST-*.xml'
          if-no-files-found: ignore
          retention-days: 1

      - name: Publish test report (쓰기 가능한 실행)
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: 테스트 결과
          detailed_summary: true

      # Dependabot/fork PR에서도 현재 job summary와 로그 annotation은 즉시 남긴다.
      # 별도 체크 게시 자체는 test-report.yml의 workflow_run이 담당한다.
      - name: Annotate test report (Dependabot/fork PR)
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (github.actor == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository) }}
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          annotate_only: true
          detailed_summary: true

      - name: Upload HTML test report (실패 분석용)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
