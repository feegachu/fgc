name: Shinhan CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful develop push CI run ID (latest develop commit only)
        required: true
        type: string

env:
  SHINHAN_PUBLIC_URL: ${{ vars.SHINHAN_PUBLIC_URL || 'https://xn--v42bn2m21nmmd.shinhanacademy.co.kr' }}

permissions:
  contents: read
  actions: read

concurrency:
  group: shinhan-fgc-deploy
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.source.outputs.deploy }}
      commit: ${{ steps.source.outputs.commit }}
      run_url: ${{ steps.source.outputs.run_url }}
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: develop
          persist-credentials: false
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
        run: python3 infra/scripts/resolve-shinhan-ci.py

  deploy:
    needs: source
    if: needs.source.outputs.deploy == 'true'
    runs-on: [self-hosted, Linux, X64, shinhan-fgc]
    environment:
      name: shinhan-stg
      url: ${{ vars.SHINHAN_PUBLIC_URL || 'https://xn--v42bn2m21nmmd.shinhanacademy.co.kr' }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Recheck source after waiting for runner
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.source.outputs.run_id }}
        run: python3 infra/scripts/resolve-shinhan-ci.py
      - name: Deploy verified images on Shinhan server
        id: deploy
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        env:
          FGC_COMMIT: ${{ needs.source.outputs.commit }}
          FGC_PUBLIC_URL: ${{ env.SHINHAN_PUBLIC_URL }}
          FGC_CI_URL: ${{ needs.source.outputs.run_url }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/shinhan-docker.XXXXXX")
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -f "$DOCKER_CONFIG/config.json"; rmdir "$DOCKER_CONFIG" 2>/dev/null || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          bash infra/scripts/deploy-shinhan.sh "$FGC_COMMIT" "$FGC_CI_URL"
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: Deployment result
        if: always()
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
        run: |
          printf 'Shinhan commit: `%s` / deploy: `%s`\n' "$SOURCE_COMMIT" "$DEPLOY_STATUS" >> "$GITHUB_STEP_SUMMARY"

  public-check:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public HTTPS and token login route
        shell: bash
        env:
          BASE_URL: ${{ env.SHINHAN_PUBLIC_URL }}
        run: |
          set -euo pipefail
          BASE_URL=${BASE_URL%/}
          code=$(curl --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 5 --max-time 15 -sS -o /dev/null -w '%{http_code}' "$BASE_URL/app/login")
          [[ "$code" == 200 ]] || { echo "Public React HTTP=$code"; exit 1; }
          code=$(curl --connect-timeout 5 --max-time 15 -sS -o /dev/null -w '%{http_code}' -X POST "$BASE_URL/api/v1/auth/login" -H 'Content-Type: application/json' -H "Origin: $BASE_URL" -H 'X-FGC-Client: web' -d '{"loginId":"__shinhan_deploy_probe__","password":"x"}')
          [[ "$code" == 401 ]] || { echo "Public token login route HTTP=$code (expected 401)"; exit 1; }
