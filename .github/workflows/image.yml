name: image
on:
  push:
    branches: [develop]
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
  packages: write
jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/feegachu/fgc
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "sha=sha-$(git rev-parse --short=12 HEAD)" >> $GITHUB_OUTPUT
          echo "alpha=a0.${{ github.run_number }}" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - name: build 3 images
        run: |
          for i in db api web; do
            docker build -f Containerfile.$i -t $REGISTRY/$i:${{ steps.v.outputs.sha }} -t $REGISTRY/$i:${{ steps.v.outputs.alpha }} .
          done
      - name: trivy gate (CRITICAL 0)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/feegachu/fgc/api:${{ steps.v.outputs.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: push
        run: |
          for i in db api web; do
            docker push $REGISTRY/$i:${{ steps.v.outputs.sha }}
            docker push $REGISTRY/$i:${{ steps.v.outputs.alpha }}
          done
          echo "pushed ${{ steps.v.outputs.sha }} = ${{ steps.v.outputs.alpha }}"
