name: Gradle Dependency Submission

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Gradle의 Dependabot 보안 알림은 해석된 의존성 그래프 제출이 필요하다.
# PR 코드는 쓰기 토큰으로 실행하지 않고, develop에 merge된 신뢰 코드만 처리한다.
permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Submit Gradle dependency graph
        # v6 이용약관 검토 전까지 Node 24 기반 최신 v5를 사용한다.
        uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5
