// 전용 폐기 DB에서만 실행하는 원장 저장·기표 비교. 일반 test 실행에서는 비활성이다.
// 테스트가 fgc_journal_write_perf_test PostgreSQL 컨테이너를 생성한다. 외부 DB 설정은 필요 없다.
// 실행: gradlew -I scripts/verification/journal-write-performance.init.gradle test --tests '*JournalWritePerformanceTest'
// 실제 commit을 측정하며 컨테이너는 Testcontainers가 종료 시 정리한다.
allprojects {
    tasks.withType(Test).configureEach {
        systemProperty 'fgc.journal.write.performance', 'true'
        maxHeapSize = '1g'
        testLogging.showStandardStreams = true
    }
}
