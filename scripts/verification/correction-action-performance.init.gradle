// bc35de82의 예외 조치 SQL을 실행하는 JDBC 기준과 JPA를 비교한다. 일반 test 실행에서는 비활성이다.
// 원장 reverseAndRepost는 기준 리비전에서도 JPA이므로 양쪽에서 동일한 실제 서비스를 호출한다.
// 테스트가 fgc_correction_perf_test PostgreSQL 컨테이너를 생성한다. 외부 DB 설정은 필요 없다.
// 실행: gradlew -I scripts/verification/correction-action-performance.init.gradle test --tests '*CorrectionActionPerformanceTest'
// 실제 commit/행 잠금 대기를 측정한다. 컨테이너는 Testcontainers가 종료 시 정리한다.
allprojects {
    tasks.withType(Test).configureEach {
        systemProperty 'fgc.correction.action.performance', 'true'
        maxHeapSize = '1g'
        testLogging.showStandardStreams = true
    }
}
