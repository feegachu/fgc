spring:
  application:
    name: feegachu
  profiles:
    active: local
  flyway:
    enabled: true
    schemas: fgc
    default-schema: fgc
    baseline-on-migrate: true
  batch:
    jdbc:
      initialize-schema: always   # Spring Batch 메타테이블 자동 생성
    job:
      enabled: false              # ★ 앱 뜰 때 배치가 저절로 돌면 안 됩니다
  jackson:
    time-zone: Asia/Seoul         # SIR-008
    serialization:
      write-dates-as-timestamps: false  # ISO-8601로 내보님

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true   # DB snake_case ↔ Java camelCase 자동 매핑
    # 기본값(SESSION)은 같은 트랜잭션 안에서 같은 SELECT를 다시 호출해도 1차 캐시가
    # 재조회를 건너뛴다 — 그 트랜잭션 도중 REQUIRES_NEW로 커밋된 다른 세션의 변경분을
    # 못 본다(#93 JournalPersistenceService의 findBySourceKey 멱등 체크가 이 문제로
    # 같은 트랜잭션 안에서 두 번 부르면 stale null을 돌려줘 uq_journal_source_revision
    # 위반을 낼 수 있었다). STATEMENT로 낮춰 매 조회마다 다시 DB를 본다.
    local-cache-scope: STATEMENT

server:
  port: 8081
  servlet:
    session:
      timeout: 30m               # 인터페이스정의서 2-1-1

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# FGC 업무 설정 — 코드에 숫자를 박지 않기 위한 자리 (COR-004)
fgc:
  demo-month: 2026-07
  batch:
    daily-changed-contract:
      cron: "0 0 2 * * *"        # 매일 02:00. 프로젝트 운영 가정일 뿐 법정 기준 아님
      enabled: true
      triggered-by-user-id: 1    # @Scheduled 자동 실행이 triggered_by에 남길 app_user.user_id.
                                  # 운영 환경에서는 실제 배치 서비스 계정의 user_id로 바꿔야 함