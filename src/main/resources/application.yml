spring:
  application:
    name: feegachu
  profiles:
    active: local
  jpa:
    open-in-view: false         # 엔티티 조회·DTO 변환은 서비스 트랜잭션 안에서 처리
    hibernate:
      ddl-auto: validate       # 스키마 변경은 Flyway가 담당하고 JPA는 매핑만 검증
    properties:
      hibernate:
        default_schema: fgc
  datasource:
    hikari:
      connection-init-sql: "SET TIME ZONE 'Asia/Seoul'"
  flyway:
    enabled: true
    schemas: fgc
    default-schema: fgc
    baseline-on-migrate: true
  batch:
    jdbc:
      initialize-schema: always   # Spring Batch 메타테이블 자동 생성
    job:
      enabled: false              # ★ 앱 뜰 때 배치가 저절로 돌면 안 됩니다
  jackson:
    time-zone: Asia/Seoul         # SIR-008
    serialization:
      write-dates-as-timestamps: false  # ISO-8601로 내보님

server:
  port: 8081
  # 앞에 Nginx(웹 tier)가 있을 때 X-Forwarded-* 를 믿고 리다이렉트 주소를 만든다 (Containerfile.web)
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m               # 인터페이스정의서 2-1-1

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# FGC 업무 설정 — 코드에 숫자를 박지 않기 위한 자리 (COR-004)
fgc:
  demo-month: 2026-07
  # 2차 JWT 공존 모드(#400, 인터페이스정의서 §2-1-1). 키는 커밋하지 않는다 — 비어 있으면 기동마다 임의 키(JwtConfig).
  jwt:
    secret: ${FGC_JWT_SECRET:}
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  # 외부 LLM(SER-013·IF-EXT-03, OI-023). 키는 커밋하지 않는다 — 비어 있으면 AI 기능만 꺼지고 기본 업무는 그대로(FGC-AI-001).
  llm:
    # SDK 표준 이름을 먼저 보고, 기존 Podman 매니페스트(secret fgc-app)의 SPRING_AI_OPENAI_API_KEY 도 받는다.
    api-key: ${OPENAI_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini           # 주최 측 제공 키(SRC-060). 모델 교체는 이 값만 바꾼다
    timeout: 30s
    max-input-chars: 20000       # 요청당 입력 상한 — 예산 10달러(SRC-060) 보호. 팀 운영 정책
    max-output-tokens: 1024
    cooldown: 10m                # 시간 초과·401·403·404·429 뒤 AI 를 끄는 시간 — 재시도 폭주 방지. 팀 운영 정책
  batch:
    daily-changed-contract:
      cron: "0 0 2 * * *"        # 매일 02:00. 프로젝트 운영 가정일 뿐 법정 기준 아님
      enabled: true
      triggered-by-user-id: 1    # @Scheduled 자동 실행이 triggered_by에 남길 app_user.user_id.
                                  # 운영 환경에서는 실제 배치 서비스 계정의 user_id로 바꿔야 함