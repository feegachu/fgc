# messages_ko.properties 와 내용이 같은 기본(로케일 접미사 없는) 번들이다.
# Spring Boot MessageSourceAutoConfiguration 의 ResourceBundleCondition 은 로케일 접미사가
# 없는 classpath:messages.properties 존재 여부만 확인한다 — 이 파일이 없으면 messages_ko.properties가
# 있어도 MessageSource 빈 자체가 생성되지 않아 FgcMessageResolver가 항상 NoSuchMessageException을 던진다.
# FGC는 한국어 전용이라 두 파일의 내용을 동일하게 유지한다.
error.cap.exceeded=지급 확정 불가 — 1,200% 한도 초과(사용률 {n}%). 예외함에서 정정·감액·취소를 선택하세요.
error.cap.reviewRequired=지급 확정 불가 — 검토필요 상태의 귀속행이 있습니다. 예외함에서 먼저 처리하세요.
error.cap.unresolvedViolation=지급 확정 불가 — 해결되지 않은 1,200% 한도 위반 예외가 있습니다. 예외함에서 먼저 처리하세요.
error.cap.ruleMissing=한도 검증 보류 — 적용 가능한 1,200% 룰셋이 없습니다. 정책을 확인하세요.

error.transaction.duplicate=저장 불가 — 이미 등록된 지급 건입니다.
error.transaction.noAttribution=지급 확정 불가 — 이 돈이 어느 계약 몫인지 먼저 입력하세요.
error.transaction.attributionMismatch=지급 확정 불가 — 귀속금액 합계({a}원)가 지급액({b}원)과 다릅니다. 차액 {c}원.
error.transaction.evidenceRequired=저장 불가 — "제외"를 선택하면 증빙을 입력해야 합니다.
error.transaction.draftOnly=저장 불가 — 지급 건은 작성중 상태로만 새로 만들 수 있습니다.
error.transaction.cancelConfirmedOnly=취소 불가 — 확정된 지급 건만 취소할 수 있습니다.
error.transaction.policyVersionMissing=지급 확정 불가 — 적용 가능한 정책 버전을 찾을 수 없습니다. 정책을 확인하세요.
error.transaction.attributionBeforeContract=지급 확정 불가 — 귀속일은 계약일 이후여야 합니다.

error.contract.duplicate=저장 불가 — 이미 등록된 계약번호입니다.
error.contract.futureDate=저장 불가 — 계약일은 오늘 이후일 수 없습니다.

error.schedule.irreversible=되돌릴 수 없습니다 — 확정된 스케줄은 새 버전으로만 바꿉니다.
error.schedule.confirmedImmutable=수정 불가 — 확정된 스케줄은 고칠 수 없습니다. 새 버전 만들기를 누르세요.
error.schedule.capExceeded=스케줄 확정 불가 — 1,200% 한도를 초과했습니다. 한도 검증 결과를 확인하세요.
error.schedule.capReviewRequired=스케줄 확정 불가 — 한도 판정에 추가 검토가 필요합니다. 검토 사유를 확인하세요.

error.validationRun.alreadyRunning=실행 생성 불가 — 이번 달 검증이 이미 진행 중입니다.
error.validationRun.conditionsRemaining=확정 불가 — {n}개 조건이 남았습니다. 아래 체크리스트를 확인하세요.
error.validationRun.finalizedImmutable=수정 불가 — 확정된 검증 결과입니다. 새 실행을 만드세요.
error.validationRun.invalidTransition=상태 변경 불가 — {from}에서 {to}로 바꿀 수 없습니다.
error.validationRun.stateConflict=상태 변경 불가 — 그 사이 다른 요청이 상태를 바꿨습니다. 다시 조회 후 시도하세요.

error.ledger.imbalance=기표 불가 — 차변 합계와 대변 합계가 다릅니다. 차액 {c}원.
error.ledger.alreadyPosted=저장 불가 — 이미 기표된 분개입니다.
error.ledger.reverseOnly=수정 불가 — 분개는 고치지 않습니다. 역분개로 바로잡으세요.
error.journal.invalidAccount=저장 불가 — 존재하지 않거나 비활성화된 계정과목입니다. {accountCode}

error.reconciliation.duplicateGroup=처리 불가 — 같은 대사 그룹이 중복 생성되었습니다. 실행을 다시 시작하세요.
error.reconciliation.duplicateRun=실행 생성 불가 — 같은 조건의 대사 실행이 이미 존재합니다. 기존 실행을 확인하세요.
error.reconciliation.noValidationRun=처리 불가 — 이 대사 실행은 월 검증 실행과 연결되어 있지 않아 예외를 생성할 수 없습니다.
error.reconciliation.notCompleted=처리 불가 — 대사 실행이 완료되지 않았습니다. 실행이 끝난 뒤 예외를 생성하세요.

error.exception.reasonRequired=저장 불가 — 처리 사유를 입력하세요.
error.exception.invalidTransition=처리 불가 — 현재 예외 상태에서는 요청한 조치를 수행할 수 없습니다.

error.auth.invalidCredentials=아이디 또는 비밀번호가 맞지 않습니다.
error.auth.sessionExpired=로그인이 만료되었습니다. 다시 로그인하세요.
error.auth.forbidden=이 작업을 할 권한이 없습니다.

error.common.validation=입력값을 확인하세요. ({field})
error.common.notFound=요청한 데이터를 찾을 수 없습니다. ({id})
error.common.internal=처리 중 오류가 발생했습니다. 요청번호 {requestId}를 담당자에게 알려주세요.

info.common.empty=조건에 맞는 자료가 없습니다. 검색 조건을 바꿔 보세요.

# 역할 4종 — 공통 셸 헤더 배지. app_role.role_code 값을 그대로 키로 쓴다.
role.SYSTEM_ADMIN=시스템관리자
role.SYSTEM_ADMIN.desc=전부
role.GA_ADMIN=GA관리자
role.GA_ADMIN.desc=정책·조직 조회, 검증 확정
role.SETTLEMENT=정산담당자
role.SETTLEMENT.desc=계약·지급 등록, 검증 실행, 예외 처리
role.COMPLIANCE=준법·감사
role.COMPLIANCE.desc=조회만 — 모든 처리 버튼 회색
