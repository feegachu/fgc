<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: page(~{::main}, 'FGC-UI-DASH-W01', '업무 대시보드', null, null)}">
<body>
<main id="main-content" class="page-content dashboard-page">
  <header class="page-header">
    <div class="page-header-copy"><h1 class="page-title">업무 대시보드</h1></div>
  </header>

  <section class="kpi-grid" aria-label="주요 검증 지표">
    <a class="kpi-card kpi-card-error" th:href="@{/cap-checks(status='VIOLATION',month=${month})}"><div class="kpi-card-header"><span class="kpi-label">1,200% 위반</span></div><div class="kpi-value-row"><strong class="kpi-value" th:text="${summary.capViolation()}">0</strong><span class="kpi-unit">건</span></div><div class="kpi-card-footer"><span class="kpi-comparison">확정 위반 판정</span></div></a>
    <a class="kpi-card kpi-card-warning" th:href="@{/cap-checks(status='WARNING',month=${month})}"><div class="kpi-card-header"><span class="kpi-label">1,200% 주의</span></div><div class="kpi-value-row"><strong class="kpi-value" th:text="${summary.capWarning()}">0</strong><span class="kpi-unit">건</span></div><div class="kpi-card-footer"><span class="kpi-comparison">사용률 경고 기준 이상</span></div></a>
    <a class="kpi-card kpi-card-warning" th:href="@{/arbitrage-checks(status='CANDIDATE',month=${month})}"><div class="kpi-card-header"><span class="kpi-label">차익거래 검토대상</span></div><div class="kpi-value-row"><strong class="kpi-value" th:text="${summary.arbitrageCandidate()}">0</strong><span class="kpi-unit">건</span></div><div class="kpi-card-footer"><span class="kpi-comparison">위반 확정 아님</span></div></a>
    <a class="kpi-card kpi-card-risk" th:href="@{/reconciliations(onlyMismatch=true,month=${month})}"><div class="kpi-card-header"><span class="kpi-label">대사 불일치</span></div><div class="kpi-value-row"><strong class="kpi-value" th:text="${summary.reconMismatch()}">0</strong><span class="kpi-unit">건</span></div><div class="kpi-card-footer"><span class="kpi-comparison">허용오차 0원</span></div></a>
    <a class="kpi-card" th:classappend="${summary.journalImbalance() == 0} ? ' kpi-card-success' : ' kpi-card-error'" th:href="@{/journals(imbalanceOnly=true,month=${month})}"><div class="kpi-card-header"><span class="kpi-label">원장 불균형</span></div><div class="kpi-value-row"><strong class="kpi-value" th:text="${summary.journalImbalance()}">0</strong><span class="kpi-unit">건</span></div><div class="kpi-card-footer"><span class="kpi-comparison">기표 전 0건 필수</span></div></a>
    <!-- OPEN 은 exception_case.status 값이 아니라 EXCP-W01 과 공유하는 화면 묶음 필터다(= NEW + IN_REVIEW).
         ExceptionCaseViewController 가 ExceptionStatus.dbStatuses() 로 풀어서 조회하므로(#83)
         이 링크는 그대로 둔다 — NEW/IN_REVIEW 로 바꾸면 예외함 상태 select 어휘와 어긋난다. -->
    <a class="kpi-card kpi-card-warning" th:href="@{/exceptions(status='OPEN',month=${month})}"><div class="kpi-card-header"><span class="kpi-label">미처리 예외</span></div><div class="kpi-value-row"><strong class="kpi-value" th:text="${summary.openException()}">0</strong><span class="kpi-unit">건</span></div><div class="kpi-card-footer"><span class="kpi-comparison">신규 + 검토중</span></div></a>
  </section>

  <div class="dashboard-main-grid">
    <div class="dashboard-primary-column">
      <section class="surface" aria-labelledby="priority-title">
        <header class="surface-header"><div><h2 id="priority-title" class="surface-title">최근 예외</h2></div><a class="run-list-link" th:href="@{/exceptions}">예외함 전체 보기 →</a></header>
        <div class="data-table-viewport"><table class="data-table priority-table"><caption class="visually-hidden">최근 예외 목록</caption><thead><tr><th scope="col">심각도</th><th scope="col">유형</th><th scope="col">계약번호</th><th scope="col">예외 내용</th><th scope="col">상태</th><th scope="col">발생</th></tr></thead><tbody>
          <tr th:each="e : ${summary.recentExceptions()}">
            <td><span class="status-badge" th:classappend="${e.severity() == 'WARNING'} ? ' status-badge-warning' : (${e.severity() == 'HIGH' or e.severity() == 'CRITICAL'} ? ' status-badge-error' : ' status-badge-neutral')" th:title="${e.severity()}" th:text="${e.severityLabel()}">-</span></td>
            <td><span class="status-badge" th:classappend="${e.exceptionType() == 'CAP_WARNING' or e.exceptionType() == 'ARBITRAGE_CANDIDATE' or e.exceptionType() == 'ALLOCATION_EVIDENCE_MISSING'} ? ' status-badge-warning' : (${e.exceptionType() == 'CAP_VIOLATION' or e.exceptionType() == 'RECONCILIATION_MISMATCH' or e.exceptionType() == 'JOURNAL_IMBALANCE' or e.exceptionType() == 'POLICY_MISSING' or e.exceptionType() == 'POLICY_DUPLICATE'} ? ' status-badge-error' : (${e.exceptionType() == 'CAP_REVIEW_REQUIRED' or e.exceptionType() == 'REFUND_TABLE_MISSING' or e.exceptionType() == 'PRODUCT_CODE_MISMATCH' or e.exceptionType() == 'DATA_QUALITY'} ? ' status-badge-review' : ' status-badge-neutral'))" th:title="${e.exceptionType()}" th:text="${e.exceptionTypeLabel()}">-</span></td>
            <td class="tabular-nums" th:title="${e.contractNo()}" th:text="${e.contractNo()}">-</td>
            <td class="dashboard-disclosure-cell"><div class="table-cell-disclosure"><a class="table-cell-preview is-single-line" th:href="@{/exceptions(contractNo=${e.contractNo()})}" th:text="${e.title()}">-</a><details class="table-cell-details" hidden><summary><span class="table-cell-more">전체 보기</span><span class="table-cell-less">접기</span><span class="material-symbols-rounded table-cell-chevron" aria-hidden="true">expand_more</span></summary><p class="table-cell-full" th:text="${e.title()}">-</p></details></div></td>
            <td><span class="status-badge" th:classappend="${e.status() == 'NEW'} ? ' status-badge-error' : (${e.status() == 'IN_REVIEW'} ? ' status-badge-info' : (${e.status() == 'RESOLVED'} ? ' status-badge-success' : ' status-badge-review'))" th:title="${e.status()}" th:text="${e.statusLabel()}">-</span></td>
            <td class="tabular-nums" th:text="${#temporals.format(e.createdAt(), 'yyyy-MM-dd HH:mm')}">-</td>
          </tr>
          <tr th:if="${summary.recentExceptions().isEmpty()}"><td colspan="6"><div class="empty-state" th:text="#{info.common.empty}">조건에 맞는 자료가 없습니다.</div></td></tr>
        </tbody></table></div>
      </section>
    </div>

    <aside class="dashboard-secondary-column" aria-label="마감 및 실행 현황">
      <section class="surface run-list-card" aria-labelledby="run-list-title"><div class="run-list-header"><h2 id="run-list-title" class="run-list-title">최근 통합검증 실행</h2><a class="run-list-link" th:href="@{/validation-runs}">실행 목록 →</a></div>
        <a class="run-row" th:each="r : ${summary.recentRuns()}" th:href="@{/validation-runs/{id}(id=${r.validationRunId()})}">
          <strong class="run-title" th:text="${r.validationMonth()} + ' · ' + ${r.runNo()} + '회차'">-</strong>
          <span class="run-meta" th:text="${r.currentStep() == null ? 0 : r.currentStep()} + '/10 단계 · 실행 ' + ${r.triggeredBy()}">-</span>
          <span class="status-badge" th:classappend="${r.status() == 'FAILED'} ? ' status-badge-error' : (${r.status() == 'FINALIZED' or r.status() == 'COMPLETED'} ? ' status-badge-success' : (${r.status() == 'RUNNING'} ? ' status-badge-info' : ' status-badge-neutral'))" th:title="${r.status()}" th:text="${r.statusLabel()}">-</span>
          <span class="progress" role="progressbar" aria-label="검증 진행률" aria-valuemin="0" aria-valuemax="100" th:attr="aria-valuenow=${r.currentStep() == null ? 0 : r.currentStep() * 10}"><span class="progress-bar" th:attr="data-progress=${r.currentStep() == null ? 0 : r.currentStep() * 10}"></span></span>
        </a>
        <div class="empty-state" th:if="${summary.recentRuns().isEmpty()}" th:text="#{info.common.empty}">조건에 맞는 자료가 없습니다.</div>
      </section>
    </aside>
  </div>
</main>
</body>
</html>
