<!DOCTYPE html>
<!--
  FGC-UI-EXCP-W01 예외함 (워크큐)
  요구사항 FUN-052(자동 생성) · FUN-053(처리 워크플로) · FUN-034
  데이터  읽기·쓰기 exception_case, exception_action
  API     GET  /api/v1/exceptions?type=&severity=&status=&assignee=
          POST /api/v1/exceptions/{id}/actions   (사유 필수)
  라우트  GET /exceptions → exception/list.html

  [막을 것]
   · 사유 없이 상태 변경 — 저장 버튼 비활성 + DB NOT NULL 이 물리적으로 막습니다
   · ★ "승인하여 초과 지급" 같은 선택지 자체를 만들지 않습니다
   · 처리 이력 수정·삭제 — append-only 입니다
   · 같은 원천에 예외 중복 생성 — exception_key UNIQUE 로 재실행해도 1건입니다

  [정적 부착 단계] 목업(30_산출물/화면_MVP/FGC-UI-EXCP-W01)의 정적 골격만 옮겼다.
  데이터 영역(안내 배너·유형별 요약카드·목록·처리 패널·처리 이력)은
  예외 조회 API(GET /api/v1/exceptions) 연동 시 서버 렌더링으로 채운다.
-->
<html th:replace="~{layout/default :: page(~{::main}, 'FGC-UI-EXCP-W01', '예외함', null, null)}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="fgc-main">

  <h1 class="fgc-page-title">예외함</h1>
  <p class="fgc-page-desc">규제·대사·데이터 문제로 <strong>사람이 봐야 하는 건</strong>만 모입니다.</p>

  <div class="fgc-banner fgc-banner--warn" style="margin-top:12px">
    <span class="material-symbols-outlined" style="font-size:18px">inbox</span>
    <!-- 미처리 건수 안내 문구 — 예외 조회 API 연동 시 서버 렌더링으로 채운다 -->
    <span id="notice-exception"></span>
  </div>

  <!-- ① 유형별 미처리 요약 — 예외 조회 API 연동 시 서버 렌더링으로 채운다 -->
  <section style="margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px"
           id="summary-cards" aria-label="유형별 미처리 요약"></section>

  <!-- ② 검색 -->
  <section class="fgc-card" style="margin-top:16px">
    <div class="fgc-card__body fgc-toolbar">
      <div class="fgc-field" style="min-width:190px">
        <label class="fgc-label" for="f-type">예외 유형</label>
        <select class="fgc-select" id="f-type"><option value="">전체</option></select>
      </div>
      <div class="fgc-field" style="min-width:130px">
        <label class="fgc-label" for="f-severity">심각도</label>
        <select class="fgc-select" id="f-severity"><option value="">전체</option></select>
      </div>
      <div class="fgc-field" style="min-width:140px">
        <label class="fgc-label" for="f-status">상태</label>
        <select class="fgc-select" id="f-status">
          <option value="OPEN">미처리 (신규 + 검토중)</option>
          <option value="">전체</option>
        </select>
      </div>
      <div class="fgc-field" style="min-width:140px">
        <label class="fgc-label" for="f-assignee">담당자</label>
        <select class="fgc-select" id="f-assignee"><option value="">전체</option></select>
      </div>
      <div class="fgc-field" style="min-width:150px">
        <label class="fgc-label" for="f-contract">계약번호</label>
        <input class="fgc-input" id="f-contract" type="text" placeholder="C004">
      </div>
      <button class="fgc-btn fgc-btn--ghost" id="f-reset">
        <span class="material-symbols-outlined" style="font-size:18px">restart_alt</span> 초기화
      </button>
    </div>
  </section>

  <div style="margin-top:16px;display:grid;grid-template-columns:1.5fr 1fr;gap:16px" id="work-grid">

    <!-- ③ 목록 -->
    <section class="fgc-card">
      <div class="fgc-card__head">
        <span class="fgc-card__title">예외 목록</span>
        <span class="fgc-muted" style="font-size:12px"><span id="row-count">0</span>건 · 한 화면 20행</span>
      </div>
      <div style="overflow-x:auto">
        <table class="fgc-table">
          <thead>
            <tr>
              <th style="width:56px">번호</th>
              <th style="width:150px">유형</th>
              <th style="width:74px">심각도</th>
              <th style="width:70px">계약</th>
              <th>내용</th>
              <th style="width:86px">상태</th>
              <th style="width:84px">담당자</th>
              <th style="width:106px">발생</th>
            </tr>
          </thead>
          <tbody id="list-body">
            <tr><td colspan="8"><div class="fgc-empty" th:text="#{info.common.empty}">조건에 맞는 자료가 없습니다.</div></td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- ④ 처리 패널 + ⑤ 이력 -->
    <div style="display:flex;flex-direction:column;gap:16px">

      <section class="fgc-card">
        <div class="fgc-card__head">
          <span class="fgc-card__title">처리</span>
          <span id="sel-badge"></span>
        </div>
        <div class="fgc-card__body" id="detail-body">
          <p class="fgc-muted" style="font-size:13px;margin:0">왼쪽 목록에서 한 건을 고르세요.</p>
        </div>
      </section>

      <section class="fgc-card">
        <div class="fgc-card__head">
          <span class="fgc-card__title">처리 이력</span>
          <span class="fgc-muted" style="font-size:11px">기록만 쌓입니다. 고치거나 지울 수 없습니다</span>
        </div>
        <div class="fgc-card__body" id="history-body">
          <p class="fgc-muted" style="font-size:13px;margin:0">—</p>
        </div>
      </section>
    </div>
  </div>

<!-- 스크립트는 main 안에 둔다 - 셸의 page()는 ~{::main}만 삽입하므로 main 밖 스크립트는 렌더링에서 사라진다 -->
<script>
/* 화면 폭이 좁으면 목록·처리 패널을 세로로 — 데이터 렌더링은 API 연동 시 추가 */
(function () {
  "use strict";
  function reflow() {
    document.getElementById("work-grid").style.gridTemplateColumns =
      window.innerWidth < 1200 ? "1fr" : "1.5fr 1fr";
  }
  reflow();
  window.addEventListener("resize", reflow);
})();
</script>
</main>
</body>
</html>
