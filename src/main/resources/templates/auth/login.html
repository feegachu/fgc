<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FGC GA 수수료 정산·검증 플랫폼 로그인">
  <meta name="theme-color" content="#467AA2">
  <title>로그인 | FGC</title>
  <link rel="icon" type="image/png" th:href="@{/images/brand/favicon-32.png}">
  <link rel="stylesheet" th:href="@{/css/common/variables.css}">
  <link rel="stylesheet" th:href="@{/css/common/reset.css}">
  <link rel="stylesheet" th:href="@{/css/common/components.css}">
  <link rel="stylesheet" th:href="@{/css/features/auth.css}">
  <script th:src="@{/js/features/auth/login.js}" defer></script>
</head>
<body class="auth-page">
<main class="auth-layout">
  <aside class="auth-brand-panel" aria-label="FGC 플랫폼 소개">
    <div class="auth-brand-identity">
      <img class="auth-brand-logo" th:src="@{/images/brand/logo-horizontal-white.png}" alt="FGC" width="120" height="50">
      <p class="auth-brand-caption">GA 수수료 정산·검증 플랫폼</p>
    </div>
    <section class="auth-brand-message" aria-labelledby="auth-brand-title">
      <h1 id="auth-brand-title">정산 결과를 연결하고,<br>규제를 검증합니다.</h1>
      <p>계약·지급·대사·예외를 하나의 흐름으로 관리하고<br>모든 판정의 계산근거와 변경 이력을 끝까지 추적합니다.</p>
    </section>
    <footer class="auth-brand-footer"><p>접속 기록과 주요 변경 이력은 감사로그에 안전하게 남습니다.</p><p>FGC v2.0</p></footer>
  </aside>

  <section class="auth-surface" aria-labelledby="login-title">
    <div class="auth-login-content">
      <img class="auth-mobile-logo" th:src="@{/images/brand/logo-horizontal-flat.png}" alt="FGC" width="96" height="40">
      <div class="auth-heading-anchor" aria-hidden="true"></div>
      <header class="auth-login-header"><p class="auth-eyebrow">FGC WORKSPACE</p><h2 id="login-title">로그인</h2><p>업무 계정의 아이디와 비밀번호를 입력하세요.</p></header>
      <div class="auth-error" role="alert" aria-live="polite" th:classappend="${param.error != null} ? ' is-visible'">
        <span class="material-symbols-rounded" aria-hidden="true">error</span><span data-login-error-message th:text="#{error.auth.invalidCredentials}">아이디 또는 비밀번호가 맞지 않습니다.</span>
      </div>
      <form class="auth-form" th:action="@{/login}" method="post" data-login-form novalidate>
        <label class="field auth-field"><span class="field-label">아이디</span><input class="field-control auth-control" type="text" name="username" autocomplete="username" placeholder="업무 계정 아이디" required autofocus></label>
        <label class="field auth-field"><span class="field-label">비밀번호</span><span class="auth-password-control">
          <input class="field-control auth-control" type="password" name="password" autocomplete="current-password" placeholder="비밀번호 입력" required data-password-input>
          <button class="icon-button auth-password-toggle" type="button" aria-label="비밀번호 표시" aria-pressed="false" data-password-toggle><span class="material-symbols-rounded" aria-hidden="true">visibility</span></button>
        </span></label>
        <button class="button button-primary button-large auth-submit" type="submit">로그인</button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
