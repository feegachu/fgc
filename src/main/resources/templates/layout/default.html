<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:fragment="page(content, screenId, title, parentTitle, parentHref)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#467AA2">
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
  <title th:text="${title} + ' (' + ${screenId} + ') · FGC'">FGC</title>
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/brand/favicon-32.png}">
  <link rel="stylesheet" th:href="@{/assets/fgc.css}">
  <link rel="stylesheet" th:href="@{/css/common/variables.css}">
  <link rel="stylesheet" th:href="@{/css/common/reset.css}">
  <link rel="stylesheet" th:href="@{/css/common/layout.css}">
  <link rel="stylesheet" th:href="@{/css/common/components.css}">
  <link rel="stylesheet" th:href="@{/css/common/utilities.css}">
  <link rel="stylesheet" th:href="@{/css/features/publishing.css}">
  <link rel="stylesheet" th:if="${screenId == 'FGC-UI-AUDT-W01'}" th:href="@{/css/features/audit.css}">
  <link rel="stylesheet" th:if="${screenId == 'FGC-UI-BASE-W01'}" th:href="@{/css/features/base.css}">
  <link rel="stylesheet" th:if="${screenId == 'FGC-UI-DASH-W01'}" th:href="@{/css/features/dashboard.css}">
  <link rel="stylesheet" th:if="${#strings.startsWith(screenId, 'FGC-UI-CONT-')}" th:href="@{/css/features/contract.css}">
  <link rel="stylesheet" th:if="${#strings.startsWith(screenId, 'FGC-UI-SCHE-')}" th:href="@{/css/features/schedule.css}">
  <link rel="stylesheet" th:if="${#strings.startsWith(screenId, 'FGC-UI-CAP-') or screenId == 'FGC-UI-CONT-W02'}" th:href="@{/css/features/cap.css}">
  <link rel="stylesheet" th:if="${screenId == 'FGC-UI-POL-W01'}" th:href="@{/css/features/policy.css}">
  <link rel="stylesheet" th:if="${screenId == 'FGC-UI-EXCP-W01'}" th:href="@{/css/features/exception.css}">
</head>
<body class="app-shell" th:attr="data-workspace-tab-id=${screenId},data-workspace-tab-title=${title},data-workspace-tab-icon=${screenId == 'FGC-UI-DASH-W01' ? 'dashboard' : 'description'}">
  <script th:src="@{/js/common/sidebar-state-init.js}"></script>
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
  <div class="app-shell-layout" data-app-shell-layout>
    <aside th:replace="~{layout/fragments/sidebar :: sidebar(${screenId})}"></aside>
    <header th:replace="~{layout/fragments/header :: header(${screenId}, ${title})}"></header>
    <div class="app-main"><th:block th:replace="${content}"></th:block></div>
    <!-- 교육용 면책 문구는 시연 사실감을 위해 화면에 표기하지 않는다 — 2026-08-12 팀 결정, 근거대장 COR-009 개정 기록 -->
    <footer class="app-footer">FGC v2.0 · 수수료 정산·검증 Workspace</footer>
  </div>
  <div id="toast-region" class="toast-region" role="region" aria-label="알림" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script th:src="@{/js/common/workspace-tabs.js}" defer></script>
  <script th:src="@{/js/common/month-selector.js}" defer></script>
  <script th:src="@{/js/common/app-shell.js}" defer></script>
  <script th:src="@{/js/common/modal.js}" defer></script>
  <script th:src="@{/js/common/toast.js}" defer></script>
  <script th:src="@{/js/common/api-client.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-BASE-W01'}" th:src="@{/js/features/base/base-api.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-BASE-W01'}" th:src="@{/js/features/base/base-list.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-DASH-W01'}" th:src="@{/js/features/dashboard/dashboard.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-SCHE-W01'}" th:src="@{/js/features/schedule/schedule-list.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-SCHE-W02'}" th:src="@{/js/features/schedule/schedule-detail.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-TRAN-W01'}" th:src="@{/js/features/transaction/transaction-list.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-TRAN-W02'}" th:src="@{/js/features/transaction/transaction-form.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-CAP-W01'}" th:src="@{/js/features/cap/cap-list.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-ARB-W01'}" th:src="@{/js/features/arbitrage/arbitrage-list.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-CONT-W01'}" th:src="@{/js/features/contract/contract-list.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-CONT-W02'}" th:src="@{/js/features/contract/contract-tabs.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-POL-W01'}" th:src="@{/js/features/policy/policy-list.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-CONT-W03'}" th:src="@{/js/features/contract/contract-api.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-CONT-W03'}" th:src="@{/js/features/contract/contract-form.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-VRUN-W02'}" th:src="@{/js/features/vrun/vrun-detail.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-RECO-W01'}" th:src="@{/js/features/reco/reco.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-LEDG-W01'}" th:src="@{/js/features/ledger/ledger.js}" defer></script>
  <script th:if="${screenId == 'FGC-UI-EXCP-W01'}" th:src="@{/js/features/exception/exception-list.js}" defer></script>
</body>
</html>
