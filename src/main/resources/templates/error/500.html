<!DOCTYPE html>
<html th:replace="~{layout/default :: page(~{::main}, 'FGC-UI-ERR-500', '처리 오류', null, null)}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main id="main-content" class="page-content error-page">
  <section class="surface error-card" aria-labelledby="error-title">
    <header class="surface-header"><h1 id="error-title" class="surface-title">500 · 처리 오류</h1></header>
    <div class="surface-body error-card-body">
      <!-- 인터페이스정의서 3-3 SIR-007 규칙 3·4 — 문구는 messages.properties 에만 두고
           화면과 JSON 이 같은 키를 쓴다. GlobalExceptionHandler 도 같은 error.common.internal 을
           FgcErrorCode.COMMON_500 으로 내보내므로, 여기에 문자열을 다시 적으면 나중에 둘이 갈라진다.
           FgcMessageResolver 가 {requestId} 를 단순 치환하는 방식이라 같은 방식으로 맞춘다
           (MessageFormat 의 {0} 문법이 아니다). 부록 A FGC-COMMON-500 이 요구하는 요청번호다. -->
      <p class="error-message" th:text="${#strings.replace(#messages.msg('error.common.internal'), '{requestId}', requestId ?: '-')}">
        처리 중 오류가 발생했습니다. 요청번호 -를 담당자에게 알려주세요.
      </p>
      <!-- 요청번호는 이미 위 문장 안에 있다. format.js:errorText() 도 문구에 요청 ID 가 들어 있으면
           괄호 안에 다시 붙이지 않으므로, 여기서도 코드만 덧붙여 Ajax 토스트와 형식을 맞춘다. -->
      <p class="error-trace tabular-nums" th:if="${errorCode != null}" th:text="${errorCode}">FGC-COMMON-500</p>
      <a class="button button-secondary error-action" th:href="@{/}">대시보드로</a>
    </div>
  </section>
</main>
</body>
</html>
