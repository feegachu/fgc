<!DOCTYPE html>
<!-- 인터페이스정의서 5-3 — MPA 권한 부족은 화면으로, Ajax 는 401/403 JSON 으로 나뉜다. -->
<html th:replace="~{layout/default :: page(~{::main}, 'FGC-UI-ERR-403', '권한 없음', null, null)}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="fgc-main">
  <div class="fgc-card" style="max-width:560px;margin-top:40px">
    <div class="fgc-card__head"><span class="fgc-card__title">403 · 권한 없음</span></div>
    <div class="fgc-card__body">
      <p th:text="#{error.auth.forbidden}">이 작업을 할 권한이 없습니다.</p>
      <p class="fgc-help">
        역할에 따라 볼 수 있는 화면과 누를 수 있는 버튼이 다릅니다.
        필요한 권한은 GA관리자에게 요청하세요.
      </p>
      <a class="fgc-btn fgc-btn--ghost" th:href="@{/}" style="margin-top:16px;text-decoration:none">대시보드로</a>
    </div>
  </div>
</main>
</body>
</html>
