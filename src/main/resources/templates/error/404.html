<!DOCTYPE html>

<body>
<main class="fgc-main">

    <div class="fgc-card__body">

      <p class="fgc-help">사이드바에서 회색으로 표시된 메뉴는 2차 범위라 아직 만들어지지 않았습니다.</p>
      <a class="fgc-btn fgc-btn--ghost" th:href="@{/}" style="margin-top:16px;text-decoration:none">대시보드로</a>

  </div>
