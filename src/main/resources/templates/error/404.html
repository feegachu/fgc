<!DOCTYPE html>
<html th:replace="~{layout/default :: page(~{::main}, 'FGC-UI-ERR-404', '찾을 수 없음', null, null)}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main id="main-content" class="page-content error-page">
  <section class="surface error-card" aria-labelledby="error-title">
    <header class="surface-header"><h1 id="error-title" class="surface-title">404 · 찾을 수 없음</h1></header>
    <div class="surface-body error-card-body">
      <p class="error-message" th:text="#{error.common.pageNotFound}">요청한 화면이 없습니다.</p>
      <!-- SIR-007 규칙 3 — 403·500 과 같은 "코드 · 요청 ID: 값" 형식. -->
      <p class="error-trace tabular-nums" th:if="${errorCode != null}"><span
        th:text="${errorCode}">FGC-COMMON-004</span><span
        th:if="${requestId != null}" th:text="' · 요청 ID: ' + ${requestId}"></span></p>
      <!-- 2차 화면은 사이드바에서 회색 + '2차' 배지로 막아 두었다. 여기로 왔다면 주소를 직접 친 경우다. -->
      <p class="error-help" th:text="#{error.common.pageNotFoundHelp}">사이드바에서 회색으로 표시된 메뉴는 2차 범위라 아직 만들어지지 않았습니다.</p>
      <a class="button button-secondary error-action" th:href="@{/}">대시보드로</a>
    </div>
  </section>
</main>
</body>
</html>
