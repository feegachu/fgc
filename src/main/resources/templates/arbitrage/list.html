<!DOCTYPE html>
<!--
  FGC-UI-ARB-W01 차익거래 검증
  요구사항 FUN-063 / REG-12 · REG-23
  API     GET  /api/v1/arbitrage-checks?month=&status=&stage=&insurerId=&contractNo=&page=&size=
          POST /api/v1/contracts/{id}/arbitrage-check
  라우트  GET /arbitrage-checks → arbitrage/list.html

  CANDIDATE는 검토대상이며 위반 확정이 아니다. 지급단계는 서로 합산하지 않는다.
-->
<html th:replace="~{layout/default :: page(~{::main}, 'FGC-UI-ARB-W01', '차익거래 검증', null, null)}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main id="main-content" class="page-content publishing-page arb-page"
      th:attr="data-initial-month=${month}">

  <header class="page-header">
    <div class="page-header-copy">
      <h1 class="page-title">차익거래 검증</h1>
    </div>
  </header>

  <form class="filter-bar arb-filter-bar" id="arb-filter-form" autocomplete="off">
    <div class="filter-fields arb-filter-fields">
      <div class="filter-field arb-filter-month">
        <label class="filter-field-label" for="f-month">정산월</label>
        <input class="field-control" id="f-month" type="month" th:value="${month}" value="2026-07">
      </div>
      <div class="filter-field arb-filter-status">
        <label class="filter-field-label" for="f-status">판정</label>
        <select class="select-control" id="f-status">
          <option value="">전체</option>
          <option value="CLEAR">이상없음</option>
          <option value="CANDIDATE">검토대상</option>
          <option value="REVIEW_REQUIRED">자료부족</option>
        </select>
      </div>
      <div class="filter-field arb-filter-stage">
        <label class="filter-field-label" for="f-stage">지급단계</label>
        <select class="select-control" id="f-stage">
          <option value="GA_TO_FC" selected>GA→설계사</option>
          <option value="">전체</option>
          <option value="INSURER_TO_GA">원수사→GA</option>
        </select>
      </div>
      <div class="filter-field arb-filter-insurer">
        <label class="filter-field-label" for="f-insurer">보험회사</label>
        <select class="select-control" id="f-insurer"><option value="">전체</option></select>
      </div>
      <div class="filter-field arb-filter-contract">
        <label class="filter-field-label" for="f-contract">계약번호</label>
        <input class="field-control" id="f-contract" type="search" placeholder="계약번호 입력">
      </div>
    </div>
    <div class="filter-actions arb-filter-actions">
      <button class="button button-secondary" id="f-reset" type="button">
        <span class="material-symbols-rounded" aria-hidden="true">restart_alt</span>
        초기화
      </button>
    </div>
  </form>

  <section class="kpi-grid arb-summary-grid" id="summary-cards" aria-label="차익거래 판정 요약" aria-live="polite">
    <button type="button" class="kpi-card kpi-card-success arb-summary-card"
            data-arb-summary-status="CLEAR" aria-pressed="false">
      <span class="kpi-card-header"><span class="kpi-label">이상없음</span></span>
      <span class="kpi-value-row"><strong class="kpi-value" id="summary-clear">—</strong></span>
      <span class="kpi-card-footer"><span class="kpi-comparison">초과액이 없습니다</span></span>
    </button>
    <button type="button" class="kpi-card kpi-card-warning arb-summary-card"
            data-arb-summary-status="CANDIDATE" aria-pressed="false">
      <span class="kpi-card-header"><span class="kpi-label">검토대상</span></span>
      <span class="kpi-value-row"><strong class="kpi-value" id="summary-candidate">—</strong></span>
      <span class="kpi-card-footer"><span class="kpi-comparison">사유 확인이 필요합니다</span></span>
    </button>
    <button type="button" class="kpi-card arb-summary-card arb-summary-review"
            data-arb-summary-status="REVIEW_REQUIRED" aria-pressed="false">
      <span class="kpi-card-header"><span class="kpi-label">자료부족</span></span>
      <span class="kpi-value-row"><strong class="kpi-value" id="summary-review">—</strong></span>
      <span class="kpi-card-footer"><span class="kpi-comparison">자료 보완 후 재확인합니다</span></span>
    </button>
  </section>

  <div class="arb-content-grid">
    <section class="surface arb-list-panel" aria-labelledby="arb-list-title">
      <header class="surface-header arb-panel-header">
        <h2 class="surface-title" id="arb-list-title">③ 계약별 판정</h2>
        <span class="arb-result-count"><span class="tabular-nums" id="row-count">0</span>건</span>
      </header>
      <div class="data-table-viewport">
        <table class="data-table arb-list-table">
          <caption class="visually-hidden">검색 조건에 해당하는 계약별 차익거래 판정</caption>
          <colgroup>
            <col class="arb-col-contract"><col class="arb-col-stage"><col class="arb-col-date">
            <col class="arb-col-month"><col class="arb-col-amount"><col class="arb-col-amount">
            <col class="arb-col-amount"><col class="arb-col-amount"><col class="arb-col-source">
            <col class="arb-col-amount"><col class="arb-col-refund"><col class="arb-col-status">
          </colgroup>
          <thead>
            <tr>
              <th scope="col">계약</th>
              <th scope="col">지급단계</th>
              <th scope="col">기준일</th>
              <th scope="col" class="is-number">계약차월</th>
              <th scope="col" class="is-number">누적 납입보험료</th>
              <th scope="col" class="is-number">확정 수수료</th>
              <th scope="col" class="is-number">지급예정액</th>
              <th scope="col" class="is-number">해약환급금</th>
              <th scope="col">환급금 출처</th>
              <th scope="col" class="is-number">초과액</th>
              <th scope="col">환급금 가산</th>
              <th scope="col">판정</th>
            </tr>
          </thead>
          <tbody id="list-body">
            <tr class="arb-state-row"><td colspan="12"><div class="empty-state" th:text="#{info.common.empty}">조건에 맞는 자료가 없습니다.</div></td></tr>
          </tbody>
        </table>
      </div>
      <footer class="arb-pagination-footer">
        <nav id="arb-pagination" class="pagination-controls" aria-label="차익거래 검증 목록 페이지"></nav>
      </footer>
    </section>

    <section class="surface arb-detail-panel" aria-labelledby="arb-detail-title">
      <header class="surface-header arb-panel-header">
        <h2 class="surface-title" id="arb-detail-title">④ 상세</h2>
        <span id="detail-badge"></span>
      </header>
      <div class="surface-body arb-detail-body" id="detail-body">
        <p class="arb-detail-placeholder">왼쪽 목록에서 한 건을 고르세요.</p>
      </div>
      <div class="arb-detail-actions" th:if="${canProcess}">
        <button id="arb-recheck-button" class="button button-secondary" type="button" disabled>
          <span class="material-symbols-rounded arb-recheck-icon" aria-hidden="true">refresh</span>
          이 계약만 다시 검증
        </button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" data-modal="arb-recheck" data-close-on-backdrop="true" hidden aria-hidden="true">
    <section class="modal arb-recheck-modal" role="dialog" aria-modal="true" aria-labelledby="arb-recheck-title">
      <header class="modal-header">
        <h2 id="arb-recheck-title" class="modal-title">차익거래 수동 재검증</h2>
      </header>
      <div class="modal-body arb-recheck-body">
        <p id="arb-recheck-contract" class="arb-recheck-contract"></p>
        <div class="field">
          <label class="field-label" for="arb-recheck-date">검증 기준일</label>
          <input id="arb-recheck-date" class="field-control" type="date" data-modal-initial-focus>
        </div>
        <div class="field">
          <label class="field-label" for="arb-recheck-reason">재검증 사유</label>
          <textarea id="arb-recheck-reason" class="textarea-control" maxlength="200" rows="4"
                    placeholder="예) 지급·환수 자료 변경 확인"></textarea>
        </div>
      </div>
      <footer class="modal-footer">
        <button class="button button-secondary" type="button" data-modal-close>취소</button>
        <button id="arb-recheck-submit" class="button button-primary" type="button">재검증 실행</button>
      </footer>
    </section>
  </div>
</main>
</body>
</html>
