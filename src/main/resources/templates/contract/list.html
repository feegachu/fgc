<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/default :: page(~{::main}, 'FGC-UI-CONT-W01', '보험계약 목록', null, null)}">
<body>
<main id="main-content" class="page-content contract-list-page">
  <header class="page-header contract-page-header">
    <div class="page-header-copy"><h1 class="page-title">보험계약 목록</h1></div>
    <div class="page-header-actions">
      <a id="contract-export-button" class="button button-secondary" th:href="@{/api/v1/contracts/export.csv(contractNo=${condition.contractNo},insurerId=${condition.insurerId},productOfferingId=${condition.productOfferingId},agentId=${condition.agentId},orgId=${condition.orgId},contractDateFrom=${condition.contractDateFrom},contractDateTo=${condition.contractDateTo},currentStatus=${condition.currentStatus},capResultStatus=${condition.capResultStatus})}"><span class="material-symbols-rounded" aria-hidden="true">download</span>CSV 내보내기</a>
      <a class="button button-primary" th:href="@{/contracts/new}" th:if="${canProcess}" data-fgc-action="create"><span class="material-symbols-rounded" aria-hidden="true">add</span>신규 등록</a>
    </div>
  </header>

  <section class="surface contract-filter-card" aria-labelledby="contract-filter-title">
    <div class="surface-header contract-section-header"><h2 id="contract-filter-title" class="surface-title">검색 조건</h2><a class="button button-ghost contract-reset-button" th:href="@{/contracts}">초기화</a></div>
    <form id="contract-filter-form" class="filter-bar contract-filter-bar" method="get" th:action="@{/contracts}" th:object="${condition}">
      <div class="filter-fields contract-filter-fields">
        <div class="filter-field"><label class="filter-field-label" for="filter-contract-no">계약번호</label><input id="filter-contract-no" class="field-control" type="text" th:field="*{contractNo}" placeholder="계약번호 입력"></div>
        <div class="filter-field"><label class="filter-field-label" for="filter-insurer">보험회사</label><select id="filter-insurer" class="select-control" th:field="*{insurerId}" disabled aria-busy="true"><option value="">불러오는 중</option></select></div>
        <div class="filter-field"><label class="filter-field-label" for="filter-product">상품</label><select id="filter-product" class="select-control" th:field="*{productOfferingId}" disabled><option value="">보험회사를 선택하세요</option></select></div>
        <div class="filter-field"><label class="filter-field-label" for="filter-agent">모집 설계사</label><select id="filter-agent" class="select-control" th:field="*{agentId}" disabled aria-busy="true"><option value="">불러오는 중</option></select></div>
        <div class="filter-field"><label class="filter-field-label" for="filter-organization">조직</label><select id="filter-organization" class="select-control" th:field="*{orgId}" disabled aria-busy="true"><option value="">불러오는 중</option></select></div>
        <div class="filter-field"><label class="filter-field-label" for="filter-date-from">계약일 시작</label><input id="filter-date-from" class="field-control tabular-nums" type="date" th:field="*{contractDateFrom}"></div>
        <div class="filter-field"><label class="filter-field-label" for="filter-date-to">계약일 끝</label><input id="filter-date-to" class="field-control tabular-nums" type="date" th:field="*{contractDateTo}"></div>
        <div class="filter-field"><label class="filter-field-label" for="filter-status">계약상태</label><select id="filter-status" class="select-control" th:field="*{currentStatus}"><option value="">전체</option><option th:each="status : ${contractStatuses}" th:value="${status}" th:text="${status.label()}">정상</option></select></div>
        <div class="filter-field"><label class="filter-field-label" for="filter-cap">1,200% 판정</label><select id="filter-cap" class="select-control" th:field="*{capResultStatus}"><option value="">전체</option><option th:each="status : ${capResultStatuses}" th:value="${status}" th:text="${status.label()}">정상</option></select></div>
      </div>
      <div class="filter-actions contract-filter-actions"><button class="button button-primary" type="submit"><span class="material-symbols-rounded" aria-hidden="true">search</span>조회</button></div>
    </form>
  </section>

  <section class="surface contract-results-card" aria-labelledby="contract-results-title">
    <header class="surface-header contract-results-header"><h2 id="contract-results-title" class="surface-title">검색 결과</h2><p class="contract-result-summary"><strong th:text="${contracts.totalElements()}">0</strong>건 · 한 화면 <span th:text="${contracts.size()}">20</span>행</p></header>
    <div class="data-table-viewport contract-table-viewport" tabindex="0" role="region" aria-label="보험계약 검색 결과 표">
      <table class="data-table contract-table">
        <caption class="visually-hidden">보험계약 검색 결과</caption>
        <colgroup><col class="contract-col-number"><col class="contract-col-insurer"><col class="contract-col-product"><col class="contract-col-date"><col class="contract-col-premium"><col class="contract-col-agent"><col class="contract-col-status"><col class="contract-col-cap"><col class="contract-col-origin"></colgroup>
        <thead><tr><th scope="col">계약번호</th><th scope="col">보험회사</th><th scope="col">상품명</th><th scope="col">계약일</th><th scope="col" class="is-number">월납환산 초회보험료<span class="evidence" data-evidence><button class="evidence-trigger" type="button" aria-describedby="evidence-monthly-equivalent" aria-label="월납환산 초회보험료 설명 보기"><span class="material-symbols-rounded" aria-hidden="true">help</span></button><div class="evidence-popover" id="evidence-monthly-equivalent" popover><p class="evidence-body">주기 보험료를 월 기준으로 환산한 값입니다. 1,200% 한도 계산 기준으로 사용합니다.</p></div></span></th><th scope="col">모집 설계사</th><th scope="col" class="is-center">계약상태</th><th scope="col" class="is-center">1,200% 판정</th><th scope="col" class="is-center">데이터 출처</th></tr></thead>
        <tbody>
          <!--
            계약상태 배지 색은 화면정의서 4장 규칙 4 (정상=초록·주의=주황·위반=빨강·진행중=파랑) 를 따르고,
            그 5색에 없는 종료 상태(해지·만기·청약철회)는 neutral 로 둔다.
            같은 매핑이 contract-detail.js 의 STATUS_BADGE_CLASSES 에도 있다 — 한쪽만 고치지 말 것.
            긴 값(보험회사·상품명·설계사)은 contract-list.js 가 실제로 잘린 셀만 [전체 보기]로 바꾼다.
            계약번호는 폭을 넉넉히 잡아(차익거래 검증 화면과 동일) 토글 없이 항상 전체를 보여준다(#326).
          -->
          <tr th:each="contract : ${contracts.content()}">
            <td class="tabular-nums" th:title="${contract.contractNo}"><a th:href="@{/contracts/{id}(id=${contract.contractId})}" th:text="${contract.contractNo}">-</a></td>
            <td data-disclosure th:title="${contract.insurerName}" th:text="${contract.insurerName}">-</td>
            <td data-disclosure th:title="${contract.productName}" th:text="${contract.productName}">-</td>
            <td class="tabular-nums" th:text="${contract.contractDate}">-</td>
            <td class="is-number tabular-nums" th:text="${#numbers.formatInteger(contract.monthlyEquivalentFirstPremium, 1, 'COMMA')} + '원'">0원</td>
            <td data-disclosure th:title="${contract.agentIdName}" th:text="${contract.agentIdName}">-</td>
            <td class="is-center"><span class="status-badge"
                      th:classappend="${contract.contractStatus.name() == 'ACTIVE'} ? ' status-badge-success' : (${contract.contractStatus.name() == 'UNPAID'} ? ' status-badge-warning' : (${contract.contractStatus.name() == 'LAPSED'} ? ' status-badge-error' : (${contract.contractStatus.name() == 'APPLIED' or contract.contractStatus.name() == 'REVIVED'} ? ' status-badge-info' : ' status-badge-neutral')))"
                      th:title="${contract.contractStatus.name()}" th:text="${contract.contractStatus.label()}">-</span></td>
            <td class="is-center"><span class="status-badge" th:if="${contract.capResultStatus != null}" th:classappend="${contract.capResultStatus.name() == 'NORMAL'} ? ' status-badge-success' : (${contract.capResultStatus.name() == 'WARNING'} ? ' status-badge-warning' : (${contract.capResultStatus.name() == 'VIOLATION'} ? ' status-badge-error' : ' status-badge-review'))" th:title="${contract.capResultStatus.label()}" th:text="${contract.capResultStatus.label()}">-</span><span th:if="${contract.capResultStatus == null}">-</span></td>
            <!-- 데이터 출처는 CONT-W02 요약 헤더와 같은 neutral 배지로 표시한다 — 같은 값이 화면마다 다르게 보이지 않게 한다. -->
            <td class="is-center"><span class="status-badge status-badge-neutral" th:text="${dataOriginLabels[contract.dataOrigin]}">-</span></td>
          </tr>
          <tr class="contract-empty-row" th:if="${contracts.content().isEmpty()}"><td colspan="9"><div class="empty-state" th:text="#{info.common.empty}">조건에 맞는 자료가 없습니다.</div></td></tr>
        </tbody>
      </table>
    </div>
    <nav class="contract-pagination" aria-label="계약 목록 페이지"
         th:with="totalPageCount=${contracts.totalPages() == 0 ? 1 : contracts.totalPages()}, groupStart=${(contracts.page() - 1) - ((contracts.page() - 1) % 5) + 1}, groupEnd=${T(java.lang.Math).min(groupStart + 4, totalPageCount)}">
      <span><span th:text="${contracts.page()}">1</span> / <span th:text="${totalPageCount}">1</span> 페이지</span>
      <div class="pagination-controls">
        <a class="pagination-button" th:if="${groupStart > 1}" th:href="@{/contracts(page=${groupStart - 1},size=${contracts.size()},contractNo=${condition.contractNo},insurerId=${condition.insurerId},productOfferingId=${condition.productOfferingId},agentId=${condition.agentId},orgId=${condition.orgId},contractDateFrom=${condition.contractDateFrom},contractDateTo=${condition.contractDateTo},currentStatus=${condition.currentStatus},capResultStatus=${condition.capResultStatus})}" aria-label="이전 5페이지"><span class="material-symbols-rounded" aria-hidden="true">chevron_left</span></a>
        <span class="pagination-button is-disabled" th:unless="${groupStart > 1}" aria-label="이전 5페이지" aria-disabled="true" tabindex="-1"><span class="material-symbols-rounded" aria-hidden="true">chevron_left</span></span>
        <th:block th:each="pageNumber : ${#numbers.sequence(groupStart, groupEnd)}">
          <span class="pagination-button is-active" th:if="${pageNumber == contracts.page()}" aria-current="page" th:text="${pageNumber}">1</span>
          <a class="pagination-button" th:unless="${pageNumber == contracts.page()}" th:text="${pageNumber}"
             th:href="@{/contracts(page=${pageNumber},size=${contracts.size()},contractNo=${condition.contractNo},insurerId=${condition.insurerId},productOfferingId=${condition.productOfferingId},agentId=${condition.agentId},orgId=${condition.orgId},contractDateFrom=${condition.contractDateFrom},contractDateTo=${condition.contractDateTo},currentStatus=${condition.currentStatus},capResultStatus=${condition.capResultStatus})}">1</a>
        </th:block>
        <a class="pagination-button" th:if="${groupEnd < totalPageCount}" th:href="@{/contracts(page=${groupEnd + 1},size=${contracts.size()},contractNo=${condition.contractNo},insurerId=${condition.insurerId},productOfferingId=${condition.productOfferingId},agentId=${condition.agentId},orgId=${condition.orgId},contractDateFrom=${condition.contractDateFrom},contractDateTo=${condition.contractDateTo},currentStatus=${condition.currentStatus},capResultStatus=${condition.capResultStatus})}" aria-label="다음 5페이지"><span class="material-symbols-rounded" aria-hidden="true">chevron_right</span></a>
        <span class="pagination-button is-disabled" th:unless="${groupEnd < totalPageCount}" aria-label="다음 5페이지" aria-disabled="true" tabindex="-1"><span class="material-symbols-rounded" aria-hidden="true">chevron_right</span></span>
      </div>
    </nav>
  </section>
</main>
</body>
</html>
