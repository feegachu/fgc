<!DOCTYPE html>
<html class="light" lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FGC</title>
<!-- FUN-001 개발 순서 13 -->
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/assets/fgc.css}">
<style>body { font-family: Inter, sans-serif; color: #171c1f; margin: 0; padding: 40px 24px; }</style>
</head>
<body>
<!-- ponytail: DASH-W01(FUN-057) 대시보드가 만들어지면 이 화면은 통째로 대체됩니다 -->
<div style="max-width:640px;margin:0 auto">

  <h1 class="fgc-page-title">FGC</h1>
  <p class="fgc-page-desc">로그인되었습니다. 대시보드(DASH-W01)는 아직 만들어지지 않았습니다.</p>

  <div class="fgc-card" style="margin-top:24px">
    <div class="fgc-card__head"><span class="fgc-card__title">로그인 정보</span></div>
    <div class="fgc-card__body">
      <p>사용자 <strong sec:authentication="principal.userName">-</strong>
        (<span class="fgc-mono" sec:authentication="name">-</span>)</p>
      <p>역할 <span class="fgc-mono" sec:authentication="principal.roleCode">-</span></p>
    </div>
  </div>

  <form method="post" th:action="@{/logout}" style="margin-top:24px">
    <button class="fgc-btn fgc-btn--ghost" type="submit">로그아웃</button>
  </form>

</div>
</body>
</html>
