plugins {
    id 'java'
    id 'war'   // 랩 실습: bootWar → 외장 Tomcat(Containerfile.api). bootJar·bootRun 은 그대로 된다.
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.susukkang'
version = '0.0.1-SNAPSHOT'

// 이미지 스캔(zot/trivy, 2026-09-16)이 잡은 CVE 대응 — Spring Boot 3.5.16 관리 버전을 위로 덮어쓴다.
// tomcat-embed-core 10.1.55 CRITICAL 3건(수정 10.1.58+), postgresql JDBC 42.7.11 HIGH 1건(수정 42.7.12+).
// Boot 를 올릴 때 이 두 줄이 관리 버전보다 낮아지면 지운다.
ext['tomcat.version'] = '10.1.60'
ext['postgresql.version'] = '42.7.13'
// Dependabot(2026-10-06) — 운영 jar 에 들어가는 것만 올린다. Boot 3.5.16 관리 버전: jackson 2.21.4 · commons-lang3 3.17.0 · log4j 2.24.3.
// jackson #2,4,5,15-22(HIGH 5, 인증 없는 /auth/login 의 JSON 파싱 DoS 포함), commons-lang3 #1, log4j-api #8.
// commons-lang3 는 swagger-core 가 요청하는 3.20.0 에 맞춘다. 위와 같이 Boot 관리 버전이 더 높아지면 지운다.
ext['jackson-bom.version'] = '2.21.7'
ext['commons-lang3.version'] = '3.20.0'
ext['log4j2.version'] = '2.25.5'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Actuator 추가
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // WAR 로 외장 Tomcat 에 올릴 때 내장 Tomcat 은 WEB-INF/lib 에서 뺀다 (jar 실행에는 영향 없음)
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

    // 인증·인가
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 2차 JWT 공존 모드(#400) — NimbusJwtEncoder/Decoder(HS256)를 쓴다. jjwt 는 넣지 않는다.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // 입력값 검증
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // DB / JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 동적 검색: Jakarta JPA용 QueryDSL(OpenFeign). Q 타입은 Gradle의 generated 디렉터리에 생성한다.
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.7'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.7:jpa'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    // ConstraintErrorCodeResolver가 PSQLException에서 위반된 제약 이름을 직접 읽어야 해서
    // runtimeOnly로는 컴파일이 안 된다.
    implementation 'org.postgresql:postgresql'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Spring Batch
    implementation 'org.springframework.boot:spring-boot-starter-batch'

    // 외부 LLM(SER-013·IF-EXT-03) — OI-023 결정: OpenAI 공식 Java SDK, Spring AI 는 2차 미사용. 호출은 ai.service.LlmGateway 한 곳에서만.
