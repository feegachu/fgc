    testAnnotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
    // 통합 테스트가 개발자가 localhost:8081에서 쓰는 fgc DB를 공유하면 @AfterEach 정리가
    // 실제 실행 이력까지 훼손할 수 있다. 모든 테스트를 Docker 임시 PostgreSQL로 격리한다.
    systemProperty 'spring.profiles.active', 'test'
}

// 제거한 영속성 프레임워크가 전이 의존성이나 테스트 starter로 다시 들어오지 않게 CI에서도 검사한다.
tasks.register('verifyPersistenceDependencies') {
    group = 'verification'
    description = 'Checks that production and test runtime classpaths contain no MyBatis artifacts.'
    doLast {
        [configurations.runtimeClasspath, configurations.testRuntimeClasspath].each { configuration ->
            def remaining = configuration.resolvedConfiguration.resolvedArtifacts.findAll {
                it.moduleVersion.id.group.startsWith('org.mybatis') || it.name.toLowerCase().contains('mybatis')
            }
            if (!remaining.empty) {
                throw new GradleException("MyBatis remains in ${configuration.name}: ${remaining}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyPersistenceDependencies')
}
