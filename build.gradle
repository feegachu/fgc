plugins {
    id 'java'
    id 'war'   // 랩 실습: bootWar → 외장 Tomcat(Containerfile.api). bootJar·bootRun 은 그대로 된다.
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.susukkang'
version = '0.0.1-SNAPSHOT'

// 이미지 스캔(zot/trivy, 2026-09-16)이 잡은 CVE 대응 — Spring Boot 3.5.16 관리 버전을 위로 덮어쓴다.
// tomcat-embed-core 10.1.55 CRITICAL 3건(수정 10.1.58+), postgresql JDBC 42.7.11 HIGH 1건(수정 42.7.12+).
// Boot 를 올릴 때 이 두 줄이 관리 버전보다 낮아지면 지운다.
ext['tomcat.version'] = '10.1.60'
ext['postgresql.version'] = '42.7.13'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web / 화면
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // WAR 로 외장 Tomcat 에 올릴 때 내장 Tomcat 은 WEB-INF/lib 에서 뺀다 (jar 실행에는 영향 없음)
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // 인증·인가
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // 입력값 검증
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // DB / MyBatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    // ConstraintErrorCodeResolver가 PSQLException에서 위반된 제약 이름을 직접 읽어야 해서
    // runtimeOnly로는 컴파일이 안 된다.
    implementation 'org.postgresql:postgresql'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Spring Batch
    implementation 'org.springframework.boot:spring-boot-starter-batch'

    // Swagger / OpenAPI - Spring Boot 3용
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 개발 편의
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:jdbc'
    testImplementation 'org.testcontainers:postgresql'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
    // 통합 테스트가 개발자가 localhost:8081에서 쓰는 fgc DB를 공유하면 @AfterEach 정리가
    // 실제 실행 이력까지 훼손할 수 있다. 모든 테스트를 Docker 임시 PostgreSQL로 격리한다.
    systemProperty 'spring.profiles.active', 'test'
}
