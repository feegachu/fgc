# fgc 3-tier Pod — README "Pod 하나로 띄우기" 와 같은 구성을 파일로 (podman kube play 용)
# 실행(손으로): sed "s|__REGISTRY__|registry.example.com:5000|g; s|__TAG__|a0.1|g" podman/fgc-pod.yaml > /root/fgc-pod.yaml && podman kube play --network podman --tls-verify=false --replace /root/fgc-pod.yaml
# 이미지 주소는 __REGISTRY__ (zot: registry.example.com:5000 / Harbor: registry.example.com, 프로젝트 fgc Public → pull 무인증). __TAG__ 와 함께 Jenkins 가 sed 로 치환.
# 컨테이너끼리는 같은 Pod 의 localhost.
apiVersion: v1
kind: Pod
metadata:
  name: fgc
spec:
  containers:
    - name: db
      image: __REGISTRY__/fgc/db:__TAG__
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
    - name: api
      image: __REGISTRY__/fgc/api:__TAG__
      # db 가 5432 를 열 때까지 기다린 뒤 Tomcat 시작 (kube play 는 컨테이너 순서를 보장하지 않는다 — 09-16 Connection refused)
      command: ["bash", "-c", "until (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; do sleep 2; done; exec catalina.sh run"]
    - name: web
      image: __REGISTRY__/fgc/web:__TAG__
      ports:
        - containerPort: 80
          hostPort: 8088
  volumes:
    - name: pgdata
      persistentVolumeClaim:
        claimName: fgc-pgdata-alpine
