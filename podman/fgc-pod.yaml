# fgc 3-tier Pod — README "Pod 하나로 띄우기" 와 같은 구성을 파일로 (podman kube play 용)
# 실행: podman kube play --tls-verify=false --replace podman/fgc-pod.yaml   (__TAG__ 는 Jenkins 가 sed 로 치환)
# 이미지는 registry.example.com(Harbor, 프로젝트 fgc Public → pull 무인증). dev·stage 모두 /etc/hosts 에 이 이름이 있어 같은 파일로 배포한다(http → kube play --tls-verify=false).
# 컨테이너끼리는 같은 Pod 의 localhost.
apiVersion: v1
kind: Pod
metadata:
  name: fgc
spec:
  containers:
    - name: db
      image: registry.example.com/fgc/db:__TAG__
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
    - name: api
      image: registry.example.com/fgc/api:__TAG__
      # db 가 5432 를 열 때까지 기다린 뒤 Tomcat 시작 (kube play 는 컨테이너 순서를 보장하지 않는다 — 09-16 Connection refused)
      command: ["bash", "-c", "until (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; do sleep 2; done; exec catalina.sh run"]
    - name: web
      image: registry.example.com/fgc/web:__TAG__
      ports:
        - containerPort: 80
          hostPort: 8088
  volumes:
    - name: pgdata
      persistentVolumeClaim:
        claimName: fgc-pgdata-alpine
