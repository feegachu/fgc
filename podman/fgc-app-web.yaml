# 운영 WEB 앱 Pod. 네트워크는 fgc-app.kube의 Network=pasta(접속자 IP 보존).
apiVersion: v1
kind: Pod
metadata:
  name: fgc-app
spec:
  restartPolicy: Always
  containers:
    - name: web
      image: __WEB_IMAGE__
      env:
        - {name: API_UPSTREAM, value: "__API_UPSTREAM__"}
      ports:
        - {containerPort: 80, hostPort: 80}
        - {containerPort: 443, hostPort: 443}
      resources:
        limits: {memory: __WEB_MEMORY__}
      volumeMounts:
        - {name: fgcd, mountPath: /etc/nginx/fgc.d, readOnly: true}
        - {name: fgchttp, mountPath: /etc/nginx/conf.d/fgc-http.conf, readOnly: true}
        - {name: le, mountPath: /etc/letsencrypt, readOnly: true}
        - {name: acme, mountPath: /var/www/certbot, readOnly: true}
  volumes:
    - name: fgcd
      hostPath: {path: __RELEASE_DIR__/nginx/fgc.d, type: Directory}
    - name: fgchttp
      hostPath: {path: __RELEASE_DIR__/nginx/fgc-http.conf, type: File}
    - name: le
      hostPath: {path: __HOME__/letsencrypt, type: Directory}
    - name: acme
      hostPath: {path: __HOME__/certbot-www, type: Directory}