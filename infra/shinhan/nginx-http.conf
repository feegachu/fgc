# 로그인 시도 제한(#677, SRC-028). http 문맥에 둔다. 키가 비어 있는 요청은 세지 않으므로 로그인 외 경로에는 영향이 없다.
# 앞단 Academy edge가 HTTPS를 끝내 $remote_addr는 모두 edge 주소다. 그걸 키로 쓰면 전체 사용자가 한 묶음이 되어
# 몇 사람의 요청만으로 모든 로그인이 429가 된다. 그래서 edge가 덧붙인 X-Forwarded-For의 마지막 값만 쓴다(앞쪽 값은 위조할 수 있다).
# 이 헤더가 없으면 세지 않는다. 로그인이 막히는 것보다 제한이 빠지는 쪽이 낫다.
map "$uri:$http_x_forwarded_for" $fgc_login_client {
    "~^/api/v1/auth/login:.*?(?<fgc_forwarded_client>[^,\s]+)\s*$" $fgc_forwarded_client;
    default "";
}
limit_req_zone $fgc_login_client zone=fgc_login:10m rate=30r/m;
limit_req_status 429;
