# 로그인 시도 제한(#677, SRC-028). http 문맥에 둔다. 키가 비어 있는 요청은 세지 않으므로 로그인 외 경로에는 영향이 없다.
# 앞단 Academy edge가 HTTPS를 끝내 $remote_addr는 edge 주소다. edge가 덧붙인 X-Forwarded-For의 마지막 값을 사용자로 본다.
# 앞쪽 값은 클라이언트가 위조할 수 있다. edge가 이 헤더를 붙이지 않으면 마지막 값도 위조될 수 있어 접속 주소별 상한을 함께 둔다.
map $uri $fgc_login_path {
    /api/v1/auth/login 1;
    default "";
}
map "$fgc_login_path:$http_x_forwarded_for" $fgc_login_client {
    "~^1:.*?(?<fgc_forwarded_client>[^,\s]+)\s*$" $fgc_forwarded_client;
    "1:" $binary_remote_addr;
    default "";
}
map $fgc_login_path $fgc_login_peer {
    1 $binary_remote_addr;
    default "";
}
limit_req_zone $fgc_login_client zone=fgc_login:10m rate=30r/m;
limit_req_zone $fgc_login_peer zone=fgc_login_peer:1m rate=120r/m;
limit_req_status 429;
