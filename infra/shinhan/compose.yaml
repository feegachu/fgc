name: fgc-shinhan

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fgc
      POSTGRES_USER: fgc
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fgc -d fgc"]
      interval: 5s
      timeout: 5s
      retries: 30
    # 병렬 쿼리가 /dev/shm을 쓴다. 기본 64MB는 1만2천 계약 데이터에 동시 50명에서 53100 오류를 냈다(TER-008).
    shm_size: 256m
    mem_limit: 1g
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${API_IMAGE:?API_IMAGE required}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${FGC_SPRING_PROFILES_ACTIVE:-prod}
      FGC_MONITORING_SCRAPE_TOKEN: ${FGC_MONITORING_SCRAPE_TOKEN:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fgc?currentSchema=fgc
      SPRING_DATASOURCE_USERNAME: fgc
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      # Existing Shinhan DB includes applied demo migrations; retain their validation history.
      # Removing this location requires a separate data/history transition first.
      # 2026-11-18 최종 발표와 시연을 이 서버에서 한다(주최측 요구, SRC-076). 설계사 시연 계정 agent01과
      # 상품 추천 AI 시연 상품(db/demo-agent V66, V72, V73)을 함께 읽는다. agent01 비밀번호는 배포 전에 Secret으로 넣고,
      # 배포 스크립트는 공개된 시드 비밀번호가 남은 계정이 있으면 멈춘다(SRC-065).
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo,classpath:db/demo-agent
      # db/demo-agent는 이 DB에 V77까지 적용된 뒤 추가돼 번호가 더 낮다. 배포 스크립트가 V66, V72, V73이 아직 없을 때만
      # 그 실행에서 true를 넘긴다. 기본은 false라 늦게 병합된 낮은 번호는 지금처럼 기동을 멈춘다(.env에 저장하지 않음).
      SPRING_FLYWAY_OUT_OF_ORDER: "${FGC_FLYWAY_OUT_OF_ORDER:-false}"
      # 상품 추천 AI 순위 산식 스위치(FUN-079 D-01, 프로젝트 가정). 비면 RULE_NOT_CONFIGURED로 순위가 나오지 않는다.
      FGC_COMPARE_RULE_VERSION: compare-net-v1
      # 화면 기본 정산월. 시연은 11월 기준이다(Runbook 9-4). 시험의 기본값은 application.yml 그대로
      FGC_DEMO_MONTH: "2026-11"
      FGC_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      # Server-owned runtime secret only; absent key keeps the fixed-guide fallback.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1024m -XX:MaxMetaspaceSize=384m"
      TZ: Asia/Seoul
      # 환수 통지서 PDF 원본(#671). 이미지 밖 볼륨이어야 재배포 뒤에도 과거 판이 남는다
      FGC_STORAGE_ROOT: /var/lib/fgc/files
    volumes:
      - files:/var/lib/fgc/files
    ports:
      - "127.0.0.1:18081:8080"
    mem_limit: 2g
    logging: *logging

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      API_UPSTREAM: api:8080
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/guard.conf:/etc/nginx/fgc.d/guard.conf:ro
      - ./nginx/http.conf:/etc/nginx/conf.d/fgc-http.conf:ro
    mem_limit: 256m
    logging: *logging

volumes:
  pgdata:
  files:
